      if (hh < want) wp.y = Math.max(wp.y, wl.y + Math.sqrt(want * want - hh * hh));
      wp.y = Math.max(wp.y, 1.5);
    }

    if (!S.camInit) {
      S.camPos.copy(wp); S.camLook.copy(wl); S.camInit = true;
    } else {
      let lam = mode === 'follow' ? 12 : 9;
      if (S.trans > 0) { S.trans -= dt; lam = 4.8; }
      const k = 1 - Math.exp(-lam * dt);
      S.camPos.lerp(wp, k); S.camLook.lerp(wl, k);
    }
    cam.position.copy(S.camPos);
    if (typeof FX !== 'undefined' && FX && FX.shakeOffset) cam.position.add(FX.shakeOffset);
    cam.lookAt(S.camLook);
  },
};

/* =====================================================================
   Interact
   ===================================================================== */
const Interact = {
  current: null,

  init() {
    this.current = null; _plS.curKey = null;
  },

  update() {
    let best = null;
    if (Game.mode === 'walk' && Player.pos) {
      let bd = Infinity;
      const px = Player.pos.x, pz = Player.pos.z;
      for (const k in ROOM.stations) {
        const s = ROOM.stations[k];
        const d = Math.hypot(px - s.ix, pz - s.iz);
        if (d <= s.radius && d < bd) { bd = d; best = s; }
      }
    }
    const key = best ? best.key : null;
    if (key !== this.current) {
      this.current = key;
      Bus.emit('interact:prompt', { key, label: best ? best.label : '' });
    }
  },

  use() {
    if (this.current) Bus.emit('station:use', { key: this.current });
  },
};

/* ==== 08_fx.js ==== */
/* =====================================================================
   08_fx.js — 3D + screen effects (particles, rings, confetti, float text,
   fly-to-HUD icons, flash, camera shake). Public: FX. Private prefix: _fx.
   ===================================================================== */

const _fxCap = 1500;
const _fxVert = `
attribute vec3 aColor;
attribute float aSize;
attribute float aAlpha;
uniform float uScale;
varying vec3 vColor;
varying float vAlpha;
void main() {
  vColor = aColor;
  vAlpha = aAlpha;
  vec4 mv = modelViewMatrix * vec4(position, 1.0);
  float d = max(0.1, -mv.z);
  gl_PointSize = clamp(aSize * uScale / d, 0.0, 192.0);
  gl_Position = projectionMatrix * mv;
}`;
const _fxFrag = `
varying vec3 vColor;
varying float vAlpha;
void main() {
  vec2 p = gl_PointCoord - 0.5;
  float d = length(p) * 2.0;
  float a = smoothstep(1.0, 0.15, d);
  float core = smoothstep(0.45, 0.0, d);
  gl_FragColor = vec4(vColor + core * 0.6, a * vAlpha);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`;

const _fxIcons = { coins: '🪙', gems: '💎', strength: '💪' };
const _fxTargets = { coins: '#hud-coins', gems: '#hud-gems', strength: '#hud-strength' };
const _fxConfettiColors = ['#ff4d6d', '#ffd23f', '#3fd0ff', '#6bff6b', '#c77dff', '#ff9f1c', '#ffffff', '#ff6bd6'];

/* internal state (plain data, no side effects) */
const _fxS = {
  ready: false,
  layer: null, flashEl: null,
  // particles
  points: null, geo: null, mat: null,
  pos: null, col: null, size: null, alpha: null,
  vel: new Float32Array(_fxCap * 3),
  grav: new Float32Array(_fxCap),
  drag: new Float32Array(_fxCap),
  ttl: new Float32Array(_fxCap),
  maxLife: new Float32Array(_fxCap),
  baseSize: new Float32Array(_fxCap),
  baseAlpha: new Float32Array(_fxCap),
  kind: new Uint8Array(_fxCap),
  phase: new Float32Array(_fxCap),
  next: 0, alive: 0, dirty: false,
  time: 0,
  // rings
  rings: [], ringNext: 0,
  // float texts
  texts: [],
  // icons
  icons: [],
  bumpTimers: new Map(),
  lastCoinSfx: 0,
  // confetti
  cCanvas: null, cCtx: null, pieces: [], cW: 0, cH: 0,
  // flash
  flashT: 0, flashDur: 0.35, flashStr: 0,
  // shake
  shakeAmt: 0,
  // misc
  trainN: 0, repN: 0,
  col3: null, v3: null, v3b: null, v2: null,
};

function _fxRand(a, b) { return a + Math.random() * (b - a); }

function _fxCamOk() {
  return _fxS.ready && typeof Scene3D !== 'undefined' && Scene3D && Scene3D.camera;
}
function _fxPresetScale() {
  const p = (typeof Scene3D !== 'undefined' && Scene3D && Scene3D.preset) ? Scene3D.preset.particles : 1;
  return isNum(p) ? clamp(p, 0, 1) : 1;
}
function _fxCount(n) {
  const p = _fxPresetScale();
  if (p <= 0) return 0;
  return Math.max(1, Math.round(n * p));
}
function _fxToScreen(v3) {
  if (typeof Scene3D === 'undefined' || !Scene3D.toScreen) return null;
  return Scene3D.toScreen(v3);
}

function _fxEmit(x, y, z, vx, vy, vz, c, size, life, grav, drag, kind, alpha) {
  const s = _fxS;
  const i = s.next;
  s.next = (i + 1) % _fxCap;
  const k = i * 3;
  s.pos[k] = x; s.pos[k + 1] = y; s.pos[k + 2] = z;
  s.vel[k] = vx; s.vel[k + 1] = vy; s.vel[k + 2] = vz;
  s.col[k] = c.r; s.col[k + 1] = c.g; s.col[k + 2] = c.b;
  s.grav[i] = grav; s.drag[i] = drag;
  s.ttl[i] = life; s.maxLife[i] = life;
  s.baseSize[i] = size; s.size[i] = size;
  s.baseAlpha[i] = alpha; s.alpha[i] = alpha;
  s.kind[i] = kind;
  s.phase[i] = Math.random() * TAU;
  s.dirty = true;
}

function _fxParseColor(color) {
  const c = _fxS.col3;
  try { c.set(color == null ? '#ffffff' : color); } catch (e) { c.set('#ffffff'); }
  return c;
}

function _fxPosXYZ(pos) {
  return pos && isNum(pos.x) ? pos : _fxS.v3.set(0, 1, 0);
}

function _fxAcquireRingMesh() {
  const geo = new THREE.RingGeometry(0.82, 1, 48, 1);
  geo.rotateX(-Math.PI / 2);
  const mat = new THREE.MeshBasicMaterial({
    color: 0xffffff, transparent: true, opacity: 0, side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.visible = false;
  mesh.frustumCulled = false;
  mesh.renderOrder = 20;
  return mesh;
}

function _fxBump(el) {
  if (!el) return;
  const t = _fxS.bumpTimers.get(el);
  if (t) clearTimeout(t);
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
  _fxS.bumpTimers.set(el, setTimeout(() => { el.classList.remove('bump'); _fxS.bumpTimers.delete(el); }, 250));
}

function _fxHeadPos(out) {
  if (typeof Player !== 'undefined' && Player && Player.getHeadWorldPos) {
    try { return Player.getHeadWorldPos(out); } catch (e) { /* ignore */ }
  }
  return null;
}
function _fxChutePos(out) {
  if (typeof Machines !== 'undefined' && Machines && Machines.active && Machines.active.getChuteWorldPos) {
    try { const p = Machines.active.getChuteWorldPos(); if (p) return out.copy(p); } catch (e) { /* ignore */ }
  }
  return null;
}
function _fxMachineTop(out) {
  return toWorldMachine(out.set(0, MACHINE_DIMS.glassTop, 0), out);
}
function _fxCenter() {
  return { x: window.innerWidth / 2, y: window.innerHeight * 0.5 };
}

/* ------------------------------------------------------------------ */

const FX = {
  shakeOffset: new THREE.Vector3(),

  init() {
    const s = _fxS;
    if (s.ready) return;
    s.col3 = new THREE.Color();
    s.v3 = new THREE.Vector3();
    s.v3b = new THREE.Vector3();
    s.v2 = new THREE.Vector2();

    /* (a) particle system */
    s.pos = new Float32Array(_fxCap * 3);
    s.col = new Float32Array(_fxCap * 3);
    s.size = new Float32Array(_fxCap);
    s.alpha = new Float32Array(_fxCap);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(s.pos, 3).setUsage(THREE.DynamicDrawUsage));
    geo.setAttribute('aColor', new THREE.BufferAttribute(s.col, 3).setUsage(THREE.DynamicDrawUsage));
    geo.setAttribute('aSize', new THREE.BufferAttribute(s.size, 1).setUsage(THREE.DynamicDrawUsage));
    geo.setAttribute('aAlpha', new THREE.BufferAttribute(s.alpha, 1).setUsage(THREE.DynamicDrawUsage));
    geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e6);
    const mat = new THREE.ShaderMaterial({
      uniforms: { uScale: { value: 600 } },
      vertexShader: _fxVert, fragmentShader: _fxFrag,
      transparent: true, depthWrite: false, depthTest: true,
      blending: THREE.AdditiveBlending,
    });
    const pts = new THREE.Points(geo, mat);
    pts.frustumCulled = false;
    pts.renderOrder = 30;
    s.geo = geo; s.mat = mat; s.points = pts;
    if (typeof Scene3D !== 'undefined' && Scene3D && Scene3D.scene) Scene3D.scene.add(pts);

    /* (c) ring pool */
    for (let i = 0; i < 6; i++) {
      const mesh = _fxAcquireRingMesh();
      if (typeof Scene3D !== 'undefined' && Scene3D && Scene3D.scene) Scene3D.scene.add(mesh);
      s.rings.push({ mesh, t: 0, dur: 0.7, active: false, delay: 0, size: 1.6 });
    }

    /* (b) DOM layer */
    let layer = document.getElementById('fx-layer');
    if (!layer) {
      layer = document.createElement('div');
      layer.id = 'fx-layer';
      document.body.appendChild(layer);
    }
    layer.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:40;overflow:hidden;';
    s.layer = layer;
    const fl = document.createElement('div');
    fl.style.cssText = 'position:absolute;inset:0;opacity:0;pointer-events:none;';
    layer.appendChild(fl);
    s.flashEl = fl;

    s.ready = true;
    FX._subscribe();
  },

  /* ---------------- 3D particles ---------------- */
  burst(pos, color, count = 24, opts) {
    if (!_fxS.ready) return;
    const n = _fxCount(count);
    if (!n) return;
    const o = opts || {};
    const speed = o.speed != null ? o.speed : 3.5;
    const size = o.size != null ? o.size : 0.18;
    const grav = o.gravity != null ? o.gravity : 6;
    const life = o.life != null ? o.life : 0.9;
    const up = !!o.up || (isNum(o.spread) && o.spread < 0);
    const p = _fxPosXYZ(pos);
    const c = _fxParseColor(color);
    const br = c.r, bg = c.g, bb = c.b;
    for (let i = 0; i < n; i++) {
      // random direction on a sphere
      const u = Math.random() * 2 - 1, a = Math.random() * TAU, r = Math.sqrt(1 - u * u);
      const sp = speed * _fxRand(0.35, 1);
      let vx = r * Math.cos(a) * sp, vy = u * sp, vz = r * Math.sin(a) * sp;
      if (up) vy = Math.abs(vy) + speed * 0.45;
      const j = _fxRand(0.8, 1.25);
      c.setRGB(Math.min(1.6, br * j), Math.min(1.6, bg * j), Math.min(1.6, bb * j));
      _fxEmit(p.x, p.y, p.z, vx, vy, vz, c, size * _fxRand(0.6, 1.3), life * _fxRand(0.6, 1.1), grav, 1.6, 0, 1);
    }
  },

  sparkle(pos, color, count = 12) {
    if (!_fxS.ready) return;
    const n = _fxCount(count);
    if (!n) return;
    const p = _fxPosXYZ(pos);
    const c = _fxParseColor(color);
    const br = c.r, bg = c.g, bb = c.b;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, rad = Math.sqrt(Math.random()) * 0.45;
      const m = _fxRand(0.9, 1.4);
      c.setRGB(Math.min(1.8, br * m + 0.25), Math.min(1.8, bg * m + 0.25), Math.min(1.8, bb * m + 0.25));
      _fxEmit(p.x + Math.cos(a) * rad, p.y + _fxRand(-0.15, 0.3), p.z + Math.sin(a) * rad,
        _fxRand(-0.15, 0.15), _fxRand(0.35, 1.0), _fxRand(-0.15, 0.15),
        c, _fxRand(0.1, 0.22), _fxRand(0.9, 1.7), -0.05, 0.4, 1, 1);
    }
  },

  ring(pos, color, delay) {
    const s = _fxS;
    if (!s.ready || !s.rings.length) return;
    const p = _fxPosXYZ(pos);
    const r = s.rings[s.ringNext];
    s.ringNext = (s.ringNext + 1) % s.rings.length;
    r.mesh.position.set(p.x, p.y, p.z);
    r.mesh.material.color.set(color == null ? '#ffffff' : color);
    r.t = 0; r.dur = 0.7; r.delay = delay || 0; r.active = true; r.size = 1.7;
    r.mesh.scale.setScalar(0.01);
    r.mesh.material.opacity = 0;
    r.mesh.visible = r.delay <= 0;
  },

  /* ---------------- screen effects ---------------- */
  flash(color, strength = 0.6) {
    const s = _fxS;
    if (!s.ready) return;
    s.flashEl.style.background = color || '#ffffff';
    s.flashStr = clamp(strength, 0, 1);
    s.flashT = s.flashDur;
    s.flashEl.style.opacity = String(s.flashStr);
  },

  shake(amount) {
    if (!isNum(amount)) return;
    _fxS.shakeAmt = Math.min(1.5, Math.max(_fxS.shakeAmt, amount));
  },

  confetti(intensity = 1) {
    const s = _fxS;
    if (!s.ready) return;
    const W = window.innerWidth, H = window.innerHeight;
    if (!s.cCanvas) {
      const cv = document.createElement('canvas');
      cv.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;';
      s.cCanvas = cv;
      s.cCtx = cv.getContext('2d');
    }
    if (!s.cCanvas.parentNode) s.layer.insertBefore(s.cCanvas, s.layer.firstChild);
    FX._sizeConfetti();
    const n = Math.min(Math.round(120 * intensity), Math.max(0, 600 - s.pieces.length));
    for (let i = 0; i < n; i++) {
      const cannon = i % 5 < 2; // 40% shot from the bottom corners
      const pc = {
        x: 0, y: 0, vx: 0, vy: 0, rot: Math.random() * TAU, vr: _fxRand(-8, 8),
        flip: Math.random() * TAU, vf: _fxRand(4, 11),
        w: _fxRand(7, 13), h: _fxRand(11, 19),
        color: _fxConfettiColors[(Math.random() * _fxConfettiColors.length) | 0],
        sway: Math.random() * TAU, swayF: _fxRand(2, 4.5), swayA: _fxRand(30, 90),
        t: 0, life: _fxRand(2.6, 3.4), delay: 0, drag: 0.9, term: _fxRand(190, 300),
      };
      if (cannon) {
        const left = i % 2 === 0;
        pc.x = left ? W * 0.02 : W * 0.98; pc.y = H * 0.92;
        const ang = _fxRand(-1.45, -0.95); // up-ish
        const sp = _fxRand(700, 1250) * Math.min(1.4, Math.max(0.7, H / 800));
        pc.vx = (left ? 1 : -1) * Math.abs(Math.cos(ang)) * sp;
        pc.vy = Math.sin(ang) * sp;
        pc.drag = 1.2;
      } else {
        pc.x = _fxRand(0, W); pc.y = _fxRand(-40, -10);
        pc.vx = _fxRand(-60, 60); pc.vy = _fxRand(40, 200);
        pc.delay = _fxRand(0, 0.9);
      }
      s.pieces.push(pc);
    }
  },

  _sizeConfetti() {
    const s = _fxS;
    if (!s.cCanvas) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    const w = Math.round(window.innerWidth * dpr), hh = Math.round(window.innerHeight * dpr);
    if (s.cCanvas.width !== w || s.cCanvas.height !== hh) {
      s.cCanvas.width = w; s.cCanvas.height = hh;
    }
    s.cW = window.innerWidth; s.cH = window.innerHeight;
  },

  floatText(pos, text, color) {
    const s = _fxS;
    if (!s.ready) return;
    let slot = null;
    for (let i = 0; i < s.texts.length; i++) if (!s.texts[i].active) { slot = s.texts[i]; break; }
    if (!slot) {
      if (s.texts.length < 30) {
        const el = document.createElement('div');
        el.style.cssText = 'position:absolute;left:0;top:0;white-space:nowrap;font-weight:900;font-size:28px;' +
          "font-family:var(--font-d,'Fredoka One','Baloo 2','Arial Rounded MT Bold',system-ui,sans-serif);" +
          'letter-spacing:0.5px;will-change:transform,opacity;display:none;' +
          '-webkit-text-stroke:7px #1d1230;paint-order:stroke fill;' +
          'text-shadow:0 3px 0 #1d1230,0 0 14px rgba(0,0,0,0.35);';
        s.layer.appendChild(el);
        slot = { el, active: false, pos: new THREE.Vector3(), t: 0, dur: 1.1, ox: 0 };
        s.texts.push(slot);
      } else { // reuse the oldest
        slot = s.texts[0];
        for (let i = 1; i < s.texts.length; i++) if (s.texts[i].t > slot.t) slot = s.texts[i];
      }
    }
    const p = _fxPosXYZ(pos);
    slot.pos.set(p.x, p.y, p.z);
    slot.t = 0; slot.dur = 1.1; slot.active = true; slot.ox = _fxRand(-14, 14);
    slot.el.textContent = String(text);
    slot.el.style.color = color || '#ffffff';
    slot.el.style.display = 'block';
    slot.el.style.opacity = '0';
  },

  flyToHud(kind, from, amount) {
    const s = _fxS;
    if (!s.ready) return;
    const icon = _fxIcons[kind];
    if (!icon) return;
    // origin on screen
    let sx, sy;
    if (from && from.isVector3 && _fxCamOk()) {
      const sc = _fxToScreen(from);
      if (sc && sc.visible) { sx = sc.x; sy = sc.y; }
    } else if (from && isNum(from.x) && isNum(from.y) && !from.isVector3) { sx = from.x; sy = from.y; }
    if (sx === undefined) { const c = _fxCenter(); sx = c.x; sy = c.y; }
    // target
    let ex = 40, ey = 40;
    const tEl = document.querySelector(_fxTargets[kind]);
    if (tEl) {
      const r = tEl.getBoundingClientRect();
      if (r.width > 0 || r.height > 0) { ex = r.left + r.width / 2; ey = r.top + r.height / 2; }
    }
    const amt = isNum(amount) ? Math.max(0, amount) : 1;
    const n = Math.min(10, Math.round(3 + Math.log2(amt + 1)));
    for (let i = 0; i < n; i++) {
      const el = document.createElement('div');
      el.textContent = icon;
      el.style.cssText = 'position:absolute;left:0;top:0;font-size:30px;line-height:1;will-change:transform,opacity;opacity:0;' +
        'filter:drop-shadow(0 2px 0 rgba(20,10,40,0.6)) drop-shadow(0 0 8px rgba(255,230,120,0.7));';
      s.layer.appendChild(el);
      const ang = Math.random() * TAU, dist = _fxRand(40, 120);
      const bx = sx + Math.cos(ang) * dist, by = sy + Math.sin(ang) * dist * 0.8 - 30;
      const mx = (bx + ex) / 2, my = (by + ey) / 2;
      const dx = ex - bx, dy = ey - by, len = Math.hypot(dx, dy) || 1;
      const side = (Math.random() < 0.5 ? -1 : 1) * _fxRand(0.15, 0.45) * len;
      s.icons.push({
        el, kind, sx, sy, bx, by, ex, ey,
        cx: mx + (-dy / len) * side, cy: my + (dx / len) * side,
        t: 0, delay: i * 0.06 + Math.random() * 0.03, burstDur: 0.28, flyDur: _fxRand(0.55, 0.75), done: false,
      });
    }
  },

  /* ---------------- per-frame ---------------- */
  update(dt) {
    const s = _fxS;
    if (!s.ready) return;
    if (!(dt > 0)) dt = 0;
    if (dt > 0.1) dt = 0.1;
    s.time += dt;
    FX._updateParticles(dt);
    FX._updateRings(dt);
    FX._updateTexts(dt);
    FX._updateIcons(dt);
    FX._updateConfetti(dt);
    FX._updateFlash(dt);
    FX._updateShake(dt);
  },

  _updateParticles(dt) {
    const s = _fxS;
    if (s.alive === 0 && !s.dirty) return;
    // keep the point-size scale in sync with the render target
    const cam = (typeof Scene3D !== 'undefined' && Scene3D) ? Scene3D.camera : null;
    if (cam && Scene3D.renderer) {
      Scene3D.renderer.getDrawingBufferSize(s.v2);
      s.mat.uniforms.uScale.value = s.v2.y / (2 * Math.tan(THREE.MathUtils.degToRad(cam.fov) * 0.5));
    }
    const pos = s.pos, vel = s.vel, ttl = s.ttl, ml = s.maxLife, grav = s.grav, drag = s.drag;
    const size = s.size, alpha = s.alpha, bs = s.baseSize, ba = s.baseAlpha, kind = s.kind, ph = s.phase;
    const T = s.time;
    let alive = 0;
    for (let i = 0; i < _fxCap; i++) {
      const life = ttl[i];
      if (life <= 0) continue;
      const nl = life - dt;
      const k = i * 3;
      if (nl <= 0) {
        ttl[i] = 0; alpha[i] = 0; size[i] = 0;
        continue;
      }
      ttl[i] = nl;
      alive++;
      const dr = Math.max(0, 1 - drag[i] * dt);
      vel[k] *= dr; vel[k + 1] = (vel[k + 1] - grav[i] * dt) * dr; vel[k + 2] *= dr;
      pos[k] += vel[k] * dt; pos[k + 1] += vel[k + 1] * dt; pos[k + 2] += vel[k + 2] * dt;
      const t = 1 - nl / ml[i];
      if (kind[i] === 0) {
        const fade = 1 - t;
        alpha[i] = ba[i] * (t < 0.08 ? t / 0.08 : fade * (0.5 + 0.5 * fade) + 0.0);
        size[i] = bs[i] * (1 - 0.55 * t);
      } else {
        const tw = 0.5 + 0.5 * Math.sin(T * 16 + ph[i] * 3);
        const env = Math.sin(Math.PI * t);
        alpha[i] = ba[i] * env * (0.45 + 0.55 * tw);
        size[i] = bs[i] * (0.6 + 0.7 * tw) * (0.5 + 0.5 * env);
      }
    }
    const was = s.alive;
    s.alive = alive;
    if (alive > 0 || was > 0 || s.dirty) {
      s.geo.attributes.position.needsUpdate = true;
      s.geo.attributes.aColor.needsUpdate = true;
      s.geo.attributes.aSize.needsUpdate = true;
      s.geo.attributes.aAlpha.needsUpdate = true;
    }
    s.dirty = false;
    // count freshly emitted particles on the next frame: emit() sets dirty, which keeps us running
    if (alive === 0 && was === 0) s.dirty = false;
  },

  _updateRings(dt) {
    const rs = _fxS.rings;
    for (let i = 0; i < rs.length; i++) {
      const r = rs[i];
      if (!r.active) continue;
      if (r.delay > 0) { r.delay -= dt; if (r.delay > 0) continue; r.mesh.visible = true; }
      r.t += dt;
      const k = r.t / r.dur;
      if (k >= 1) { r.active = false; r.mesh.visible = false; continue; }
      const e = Ease.outCubic(k);
      r.mesh.scale.setScalar(0.25 + e * r.size);
      r.mesh.material.opacity = 0.95 * (1 - k) * (1 - k * 0.4);
    }
  },

  _updateTexts(dt) {
    const s = _fxS;
    const texts = s.texts;
    if (!_fxCamOk()) return;
    for (let i = 0; i < texts.length; i++) {
      const tx = texts[i];
      if (!tx.active) continue;
      tx.t += dt;
      const k = tx.t / tx.dur;
      if (k >= 1) { tx.active = false; tx.el.style.display = 'none'; continue; }
      const sc = _fxToScreen(tx.pos);
      if (!sc || !sc.visible) { tx.el.style.opacity = '0'; continue; }
      const rise = Ease.outQuad(k) * 70;
      const pop = k < 0.15 ? Ease.outBack(k / 0.15) : 1;
      const op = k < 0.1 ? k / 0.1 : k > 0.6 ? 1 - (k - 0.6) / 0.4 : 1;
      tx.el.style.opacity = op.toFixed(3);
      tx.el.style.transform = 'translate3d(' + (sc.x + tx.ox).toFixed(1) + 'px,' + (sc.y - rise).toFixed(1) +
        'px,0) translate(-50%,-100%) scale(' + (0.4 + 0.6 * pop).toFixed(3) + ')';
    }
  },

  _updateIcons(dt) {
    const s = _fxS;
    const icons = s.icons;
    for (let i = icons.length - 1; i >= 0; i--) {
      const ic = icons[i];
      ic.t += dt;
      const local = ic.t - ic.delay;
      let x, y, sc, op = 1;
      if (local < 0) { continue; }
      if (local < ic.burstDur) {
        const u = local / ic.burstDur;
        const e = Ease.outCubic(u);
        x = ic.sx + (ic.bx - ic.sx) * e; y = ic.sy + (ic.by - ic.sy) * e;
        sc = 0.3 + 0.9 * Ease.outBack(u);
      } else {
        const v = (local - ic.burstDur) / ic.flyDur;
        if (v >= 1) {
          // arrival
          ic.el.remove();
          icons[i] = icons[icons.length - 1]; icons.pop();
          const tEl = document.querySelector(_fxTargets[ic.kind]);
          if (tEl) _fxBump(tEl.parentElement);
          const now = performance.now();
          if (now - s.lastCoinSfx >= 70) {
            s.lastCoinSfx = now;
            if (typeof Sfx !== 'undefined' && Sfx && Sfx.play) {
              try { Sfx.play(ic.kind === 'coins' ? 'coin' : ic.kind === 'gems' ? 'gem' : 'strength'); } catch (e) { /* ignore */ }
            }
          }
          continue;
        }
        const k = Math.pow(v, 1.7), m = 1 - k;
        x = m * m * ic.bx + 2 * m * k * ic.cx + k * k * ic.ex;
        y = m * m * ic.by + 2 * m * k * ic.cy + k * k * ic.ey;
        sc = lerp(1.2, 0.7, k);
        op = v > 0.9 ? (1 - v) / 0.1 * 0.5 + 0.5 : 1;
      }
      ic.el.style.opacity = op.toFixed(2);
      ic.el.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) translate(-50%,-50%) scale(' + sc.toFixed(2) + ')';
    }
  },

  _updateConfetti(dt) {
    const s = _fxS;
    const ps = s.pieces;
    if (!s.cCanvas || !s.cCtx) return;
    if (ps.length === 0) {
      if (s.cCanvas.parentNode) s.cCanvas.parentNode.removeChild(s.cCanvas);
      return;
    }
    if (s.cW !== window.innerWidth || s.cH !== window.innerHeight) FX._sizeConfetti();
    const ctx = s.cCtx;
    const dpr = s.cCanvas.width / Math.max(1, s.cW);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, s.cCanvas.width, s.cCanvas.height);
    const H = s.cH;
    for (let i = ps.length - 1; i >= 0; i--) {
      const p = ps[i];
      if (p.delay > 0) { p.delay -= dt; continue; }
      p.t += dt;
      if (p.t >= p.life || p.y > H + 40) { ps[i] = ps[ps.length - 1]; ps.pop(); continue; }
      const dr = Math.max(0, 1 - p.drag * dt);
      p.vx *= dr; p.vy = p.vy * dr + 520 * dt;
      if (p.vy > p.term) p.vy += (p.term - p.vy) * Math.min(1, 6 * dt);
      p.sway += p.swayF * dt;
      p.x += (p.vx + Math.sin(p.sway) * p.swayA) * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt; p.flip += p.vf * dt;
      const f = Math.cos(p.flip);
      const c = Math.cos(p.rot), sn = Math.sin(p.rot);
      const rem = p.life - p.t;
      ctx.globalAlpha = rem < 0.6 ? rem / 0.6 : 1;
      ctx.setTransform(c * dpr, sn * dpr, -sn * f * dpr, c * f * dpr, p.x * dpr, p.y * dpr);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
  },

  _updateFlash(dt) {
    const s = _fxS;
    if (s.flashT <= 0) return;
    s.flashT -= dt;
    if (s.flashT <= 0) { s.flashT = 0; s.flashEl.style.opacity = '0'; return; }
    const k = s.flashT / s.flashDur;
    s.flashEl.style.opacity = (s.flashStr * k * k).toFixed(3);
  },

  _updateShake(dt) {
    const s = _fxS;
    const o = FX.shakeOffset;
    if (s.shakeAmt <= 0.001) {
      s.shakeAmt = 0;
      if (o.x !== 0 || o.y !== 0 || o.z !== 0) o.set(0, 0, 0);
      return;
    }
    const a = s.shakeAmt;
    o.set((Math.random() * 2 - 1) * a * 0.3, (Math.random() * 2 - 1) * a * 0.22, (Math.random() * 2 - 1) * a * 0.12);
    s.shakeAmt *= Math.exp(-7 * dt);
  },

  /* ---------------- Bus wiring ---------------- */
  _subscribe() {
    const s = _fxS;
    const v = s.v3b;

    Bus.on('reward', (d) => {
      if (!_fxCamOk() || !d) return;
      const src = d.source;
      let origin = null;
      if (src === 'catch') origin = _fxChutePos(v);
      else if (src === 'train') origin = _fxHeadPos(v);
      if (!origin) origin = _fxCenter();
      if (d.coins > 0) FX.flyToHud('coins', origin, d.coins);
      if (d.gems > 0) FX.flyToHud('gems', origin, d.gems);
      if (d.strength > 0 && src === 'train') {
        s.trainN++;
        const auto = !!(Game.player && Game.player.training && Game.player.training.auto);
        if (!auto || s.trainN % 4 === 0) FX.flyToHud('strength', origin, 1);
      } else if (d.strength > 0) {
        FX.flyToHud('strength', origin, Math.min(d.strength, 5));
      }
    });

    Bus.on('claw:result', (d) => {
      if (!_fxCamOk() || !d) return;
      const type = d.type;
      if (type === 'win') {
        const animal = (typeof ANIMAL_BY_ID !== 'undefined' && d.entry) ? ANIMAL_BY_ID[d.entry.id] : null;
        const rar = (animal && typeof RARITY_BY_ID !== 'undefined') ? RARITY_BY_ID[animal.rarity] : null;
        const color = rar ? rar.color : '#ffd23f';
        const p = _fxChutePos(v) || _fxMachineTop(v);
        FX.burst(p, color, 40, { speed: 4, up: true });
        FX.sparkle(p, color, 20);
        const id = rar ? rar.id : '';
        if (id === 'legendary' || id === 'mythical' || id === 'secret') {
          FX.confetti(1.5);
          FX.flash(color, 0.5);
          FX.shake(0.25);
        }
      } else {
        const top = _fxMachineTop(v);
        if (type === 'slip') FX.floatText(top, 'Slipped!', '#ff9a2e');
        else if (type === 'miss') FX.floatText(top, 'Missed!', '#b8bcc8');
        else if (type === 'empty') FX.floatText(top, 'Nothing!', '#b8bcc8');
      }
    });

    Bus.on('upgrade:bought', () => {
      if (!_fxCamOk()) return;
      const p = _fxMachineTop(v);
      FX.ring(p, '#ffe14d');
      FX.ring(v.set(p.x, p.y - 0.7, p.z), '#7dfcff', 0.12);
      FX.sparkle(p, '#fff07a', 22);
      FX.shake(0.12);
    });

    Bus.on('world:unlocked', () => {
      if (!_fxCamOk()) return;
      FX.confetti(2);
      FX.flash('#ffffff', 0.5);
    });

    Bus.on('train:rep', (d) => {
      if (!_fxCamOk() || !d) return;
      s.repN++;
      if (d.auto && s.repN % 3 !== 0) return;
      const hp = _fxHeadPos(v);
      if (!hp) return;
      hp.y += 0.45;
      FX.floatText(hp, '+' + fmt(d.gain) + ' 💪', '#ffa63d');
    });

    Bus.on('pet:added', (d) => {
      if (!_fxCamOk() || !d || !d.isNew) return;
      const p = _fxChutePos(v);
      if (p) FX.sparkle(p, '#ffffff', 18);
    });
  },
};

/* ==== 09_audio.js ==== */
/* =====================================================================
   CLAW MACHINE SIMULATOR — audio
   Every sound is synthesised with WebAudio (oscillators, a noise buffer,
   gain envelopes, filters). Public API: Sfx (see ARCHITECTURE.md section 6).
   Private top-level names use the _au prefix. Nothing runs at load time.
   ===================================================================== */

const _auMaxVoices = 24;
const _auGestureEvents = ['pointerdown', 'keydown', 'touchstart'];

/** MIDI note number -> Hz. */
const _auHz = (m) => 440 * Math.pow(2, (m - 69) / 12);

/* Generative background music per world. Degrees index into `scale`;
   `prog` gives one scale degree per bar (16 sixteenth-note steps). */
const _auWorldMusic = {
  starter: { bpm: 124, root: 60, scale: [0, 2, 4, 5, 7, 9, 11], prog: [0, 4, 5, 3], offs: [0, 2, 4, 2, 5], density: 0.45, lead: 'pluck', leadVol: 0.07, bass: 'triangle', bassVol: 0.11 },
  jungle: { bpm: 104, root: 57, scale: [0, 2, 4, 7, 9], prog: [0, 3, 0, 4], offs: [0, 1, 2, 3, 4], density: 0.5, lead: 'marimba', leadVol: 0.12, bass: 'triangle', bassVol: 0.1 },
  frozen: { bpm: 70, root: 62, scale: [0, 2, 4, 6, 7, 9, 11], prog: [0, 4, 3, 0], offs: [0, 2, 4, 6], density: 0.25, lead: 'bell', leadVol: 0.07, bass: 'sine', bassVol: 0.1 },
  desert: { bpm: 96, root: 52, scale: [0, 1, 3, 5, 7, 8, 10], prog: [0, 1, 0, 6], offs: [0, 1, 3, 4], density: 0.4, lead: 'pluck', leadWave: 'sawtooth', leadLp: 1400, leadVol: 0.06, bass: 'triangle', bassVol: 0.1 },
  space: { bpm: 80, root: 57, scale: [0, 2, 3, 5, 7, 9, 10], prog: [0, 5, 3, 6], offs: [0, 2, 4, 6], density: 0.3, lead: 'soft', leadVol: 0.05, pad: true, bass: 'sine', bassVol: 0.12 },
};

/* ---------- low-level synthesis helpers ---------- */

/** Track a playing source so the voice cap works and nodes are released when it ends. */
function _auTrack(src, nodes) {
  Sfx._voices++;
  src.onended = () => {
    Sfx._voices--;
    for (const n of nodes) { try { n.disconnect(); } catch (e) { /* already gone */ } }
  };
}

/** One oscillator with a gain envelope. o: { type, f, to, dur, vol, att, lp } */
function _auBeep(c, out, t, o) {
  if (Sfx._voices > 40) return;
  const att = o.att || 0.006;
  const v = o.vol == null ? 0.2 : o.vol;
  const src = c.createOscillator();
  const g = c.createGain();
  src.type = o.type || 'triangle';
  src.frequency.setValueAtTime(o.f, t);
  if (o.to) src.frequency.exponentialRampToValueAtTime(o.to, t + o.dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + att);
  g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
  const nodes = [src, g];
  src.connect(g);
  if (o.lp) {
    const f = c.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = o.lp; f.Q.value = 0.7;
    g.connect(f); f.connect(out); nodes.push(f);
  } else {
    g.connect(out);
  }
  src.start(t);
  src.stop(t + o.dur + 0.03);
  _auTrack(src, nodes);
}

/** Filtered noise burst. o: { type, f, to, q, dur, vol } */
function _auNoise(c, out, t, o) {
  if (Sfx._voices > 40 || !Sfx._nbuf) return;
  const src = c.createBufferSource();
  src.buffer = Sfx._nbuf;
  src.loop = true;
  const flt = c.createBiquadFilter();
  flt.type = o.type || 'bandpass';
  flt.frequency.setValueAtTime(o.f, t);
  if (o.to) flt.frequency.exponentialRampToValueAtTime(o.to, t + o.dur);
  flt.Q.value = o.q || 1;
  const g = c.createGain();
  const v = o.vol == null ? 0.1 : o.vol;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
  src.connect(flt); flt.connect(g); g.connect(out);
  src.start(t, Math.random() * 0.8);
  src.stop(t + o.dur + 0.03);
  _auTrack(src, [src, flt, g]);
}

/** Notes in quick succession. */
function _auArp(c, out, t, ms, step, o) {
  ms.forEach((m, i) => _auBeep(c, out, t + i * step, Object.assign({ type: 'triangle', f: _auHz(m), dur: 0.2, vol: 0.15 }, o)));
}

/** Notes sounding together. */
function _auChord(c, out, t, ms, dur, o) {
  for (const m of ms) _auBeep(c, out, t, Object.assign({ type: 'triangle', f: _auHz(m), dur, vol: 0.1 }, o));
}

/** Bright little bell: triangle plus a quiet octave-up sine. */
function _auDing(c, out, t, m, dur, vol) {
  _auBeep(c, out, t, { type: 'triangle', f: _auHz(m), dur, vol });
  _auBeep(c, out, t, { type: 'sine', f: _auHz(m) * 2, dur: dur * 0.6, vol: vol * 0.25 });
}

function _auNoiseBuffer(c) {
  const len = c.sampleRate;
  const b = c.createBuffer(1, len, c.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return b;
}

/** Smooth parameter change (avoids clicks). */
function _auRamp(c, param, v) {
  try { param.cancelScheduledValues(c.currentTime); param.setTargetAtTime(v, c.currentTime, 0.05); } catch (e) { /* ignore */ }
}

/* ---------- sound effects: (ctx, out, startTime) ---------- */

  train: (c, o, t) => {

    _auBeep(c, o, t, { type: 'sawtooth', f: 180, to: 70, dur: 0.18, vol: 0.22, lp: 600 });
    _auNoise(c, o, t, { type: 'bandpass', f: 700, q: 1, dur: 0.1, vol: 0.14 });
    _auBeep(c, o, t + 0.12, { type: 'sine', f: 600, to: 1300, dur: 0.08, vol: 0.16 });
  },
  error: (c, o, t) => {
    _auBeep(c, o, t, { type: 'sawtooth', f: 110, dur: 0.32, vol: 0.16, lp: 420 });
    _auBeep(c, o, t, { type: 'square', f: 116.5, dur: 0.32, vol: 0.06, lp: 420 });
    _auBeep(c, o, t + 0.36, { type: 'sawtooth', f: 98, dur: 0.25, vol: 0.12, lp: 420 });
  },
  unlock: (c, o, t) => {
    _auArp(c, o, t, [60, 64, 67, 72, 76, 79, 84], 0.065, { dur: 0.18, vol: 0.16 });
    _auChord(c, o, t + 0.5, [72, 76, 79, 84], 1.0, { vol: 0.1 });
    _auArp(c, o, t + 0.5, [96, 100, 103, 108], 0.08, { type: 'sine', dur: 0.3, vol: 0.09 });
    _auNoise(c, o, t + 0.5, { type: 'highpass', f: 7000, dur: 0.5, vol: 0.05 });
  },
  travel: (c, o, t) => {
    // warp sweep
    _auBeep(c, o, t, { type: 'sine', f: 80, to: 1600, dur: 0.75, vol: 0.22, att: 0.1 });
    _auBeep(c, o, t, { type: 'triangle', f: 160, to: 3200, dur: 0.75, vol: 0.05 });
    _auNoise(c, o, t, { type: 'bandpass', f: 500, to: 6000, q: 2, dur: 0.7, vol: 0.1 });
  },
  equip: (c, o, t) => {
    _auBeep(c, o, t, { type: 'sine', f: 400, to: 800, dur: 0.12, vol: 0.2 });
    _auNoise(c, o, t, { type: 'bandpass', f: 1200, dur: 0.04, vol: 0.06 });
  },
  sell: (c, o, t) => {
    // cash register "ka-ching"
    _auNoise(c, o, t, { type: 'highpass', f: 2500, dur: 0.02, vol: 0.12 });
    _auDing(c, o, t + 0.04, 96, 0.5, 0.14);
    _auDing(c, o, t + 0.1, 103, 0.45, 0.12);
  },
  evolve: (c, o, t) => {
    // rising magical sweep
    _auBeep(c, o, t, { type: 'sine', f: 200, to: 1600, dur: 0.9, vol: 0.16, att: 0.05 });
    _auBeep(c, o, t, { type: 'triangle', f: 300, to: 2400, dur: 0.9, vol: 0.05 });
    _auArp(c, o, t + 0.4, [84, 88, 91, 96, 100], 0.09, { type: 'sine', dur: 0.25, vol: 0.1 });
    _auChord(c, o, t + 0.95, [72, 76, 79, 84], 0.8, { vol: 0.1 });
  },
  tick: (c, o, t) => _auBeep(c, o, t, { type: 'sine', f: 1000, dur: 0.05, vol: 0.12 }),
};

/* ---------- motor hum ---------- */
function _auMotorStart() {
  const c = Sfx._ctx;
  if (!c || Sfx._mot) return;
  const now = c.currentTime;
  const out = c.createGain();
  out.gain.setValueAtTime(0, now);
  out.gain.linearRampToValueAtTime(0.08, now + 0.08);
  const lp = c.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 520; lp.Q.value = 2.5;
  lp.connect(out); out.connect(Sfx._sfxG);
  const saw = c.createOscillator(); saw.type = 'sawtooth'; saw.frequency.value = 92;
  const tri = c.createOscillator(); tri.type = 'triangle'; tri.frequency.value = 46;
  const tg = c.createGain(); tg.gain.value = 0.6;
  const lfo = c.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 5.5;
  const depth = c.createGain(); depth.gain.value = 5;
  lfo.connect(depth); depth.connect(saw.frequency);
  saw.connect(lp); tri.connect(tg); tg.connect(lp);
  saw.start(now); tri.start(now); lfo.start(now);
  Sfx._mot = { saw, tri, lfo, out, lp, depth, tg };
}

function _auMotorStop() {
  const c = Sfx._ctx;
  const m = Sfx._mot;
  if (!c || !m) return;
  Sfx._mot = null;
  const now = c.currentTime;
  m.out.gain.cancelScheduledValues(now);
  m.out.gain.setValueAtTime(m.out.gain.value, now);
  m.out.gain.linearRampToValueAtTime(0, now + 0.08);
  const end = now + 0.1;
  m.saw.stop(end); m.tri.stop(end); m.lfo.stop(end);
  m.saw.onended = () => {
    for (const k of ['saw', 'tri', 'lfo', 'depth', 'tg', 'lp', 'out']) { try { m[k].disconnect(); } catch (e) { /* ignore */ } }
  };
}

/* ---------- generative music ---------- */
function _auLead(c, out, t, cfg, f) {
  if (cfg.lead === 'marimba') {
    _auBeep(c, out, t, { type: 'sine', f, dur: 0.3, vol: cfg.leadVol, att: 0.004 });
    _auBeep(c, out, t, { type: 'sine', f: f * 4, dur: 0.08, vol: cfg.leadVol * 0.25, att: 0.002 });
  } else if (cfg.lead === 'bell') {
    _auBeep(c, out, t, { type: 'sine', f, dur: 1.4, vol: cfg.leadVol });
    _auBeep(c, out, t, { type: 'sine', f: f * 2.76, dur: 0.6, vol: cfg.leadVol * 0.3 });
  } else if (cfg.lead === 'soft') {
    _auBeep(c, out, t, { type: 'triangle', f, dur: 1.0, vol: cfg.leadVol, att: 0.08, lp: 1800 });
  } else {
    _auBeep(c, out, t, { type: cfg.leadWave || 'triangle', f, dur: 0.35, vol: cfg.leadVol, lp: cfg.leadLp || 3000 });
  }
}

/** One sixteenth-note step of a world's tune. */
function _auMusicStep(c, t, step, cfg, out) {
  const n = cfg.scale.length;
  const pitch = (idx) => cfg.root + cfg.scale[((idx % n) + n) % n] + 12 * Math.floor(idx / n);
  const sd = Sfx._mStepDur;
  const s16 = step % 16;
  const deg = cfg.prog[Math.floor(step / 16) % cfg.prog.length];
  if (s16 === 0 && cfg.pad) {
    for (const k of [0, 2, 4]) _auBeep(c, out, t, { type: 'sawtooth', f: _auHz(pitch(deg + k)), dur: sd * 16, att: 0.5, vol: 0.03, lp: 900 });
  }
  if (s16 % 8 === 0) {
    _auBeep(c, out, t, { type: cfg.bass, f: _auHz(pitch(deg) - 12), dur: sd * 6, vol: cfg.bassVol, att: 0.01 });
  }
  if (s16 % 2 === 0 && Sfx._voices < 16 && Math.random() < cfg.density) {
    _auLead(c, out, t, cfg, _auHz(pitch(deg + pick(cfg.offs)) + 12));
  }
}

function _auMusicTick() {
  const c = Sfx._ctx;
  if (!c || !Sfx._mLayer || !Sfx._mCfg) return;
  if (c.currentTime > Sfx._mNext + 0.5) Sfx._mNext = c.currentTime + 0.05; // woke up late
  while (Sfx._mNext < c.currentTime + 0.25) {
    _auMusicStep(c, Sfx._mNext, Sfx._mStep, Sfx._mCfg, Sfx._mLayer);
    Sfx._mNext += Sfx._mStepDur;
    Sfx._mStep++;
  }
}

/** Starts or stops the lookahead scheduler to match the current state. */
function _auMusicRun() {
  const c = Sfx._ctx;
  const want = !!(c && Sfx._music && Sfx._mLayer);
  if (want && !Sfx._mTimer) {
    Sfx._mNext = c.currentTime + 0.1;
    Sfx._mTimer = setInterval(_auMusicTick, 100);
  } else if (!want && Sfx._mTimer) {
    clearInterval(Sfx._mTimer);
    Sfx._mTimer = null;
  }
}

/** Starts a world's layer and crossfades from the previous one. */
function _auMusicBegin(key) {
  const c = Sfx._ctx;
  if (!c) return;
  const cfg = _auWorldMusic[key] || _auWorldMusic.starter;
  const now = c.currentTime;
  const old = Sfx._mLayer;
  if (old) {
    old.gain.cancelScheduledValues(now);
    old.gain.setValueAtTime(old.gain.value, now);
    old.gain.linearRampToValueAtTime(0, now + 1.2);
    setTimeout(() => { try { old.disconnect(); } catch (e) { /* ignore */ } }, 1500);
  }
  const g = c.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(1, now + 1.2);
  g.connect(Sfx._musicG);
  Sfx._mLayer = g;
  Sfx._mCfg = cfg;
  Sfx._mKey = key;
  Sfx._mStepDur = 60 / cfg.bpm / 4;
  Sfx._mStep = 0;
  Sfx._mNext = now + 0.12;
  _auMusicRun();
}

/* ---------- context creation / visibility / gestures ---------- */
function _auEnsureCtx() {
  if (Sfx._ctx) {
    if (Sfx._ctx.state === 'suspended' && !document.hidden) Sfx._ctx.resume().catch(() => {});
    return true;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return false;
  let c;
  try { c = new AC(); } catch (e) { return false; }
  Sfx._readSettings();
  const master = c.createGain();
  master.gain.value = Sfx._volume;
  master.connect(c.destination);
  const sfxG = c.createGain();
  sfxG.gain.value = Sfx._sound ? 0.9 : 0;
  sfxG.connect(master);
  const musicG = c.createGain();
  musicG.gain.value = Sfx._music ? 0.25 : 0;
  musicG.connect(master);
  Sfx._ctx = c;
  Sfx._master = master;
  Sfx._sfxG = sfxG;
  Sfx._musicG = musicG;
  Sfx._nbuf = _auNoiseBuffer(c);
  if (document.hidden) c.suspend().catch(() => {});
  if (Sfx._motorWant) _auMotorStart();
  if (Sfx._mWorld) _auMusicBegin(Sfx._mWorld);
  _auMusicRun();
  return true;
}

function _auOnGesture() {
  if (!_auEnsureCtx()) return;
  for (const ev of _auGestureEvents) window.removeEventListener(ev, _auOnGesture);
}

function _auOnVisibility() {
  const c = Sfx._ctx;
  if (!c) return;
  if (document.hidden) {
    if (c.state === 'running') c.suspend().catch(() => {});
  } else if (c.state === 'suspended') {
    c.resume().catch(() => {});
  }
}

const Sfx = {
  _ctx: null, _master: null, _sfxG: null, _musicG: null, _nbuf: null,
  _sound: true, _music: true, _volume: 0.8,
  _inited: false, _entered: false,
  _motorWant: false, _mot: null,
  _mWorld: null, _mKey: null, _mLayer: null, _mCfg: null,
  _mStepDur: 0.1, _mStep: 0, _mNext: 0, _mTimer: null,
  _voices: 0, _last: {},

  /** Reads settings, arms the first-gesture unlock and subscribes to Bus events. Safe to call once. */
  init() {
    if (this._inited) return;
    this._inited = true;
    this._readSettings();
    for (const ev of _auGestureEvents) window.addEventListener(ev, _auOnGesture, { passive: true });
    document.addEventListener('visibilitychange', _auOnVisibility);

    Bus.on('claw:result', (d) => {
      const t = d && d.type;
      if (t === 'win') Sfx.play('win');
      else if (t === 'miss' || t === 'empty') Sfx.play('miss');
      else if (t === 'slip') Sfx.play('slip');
    });
    Bus.on('upgrade:bought', () => Sfx.play('upgrade'));
    Bus.on('world:unlocked', () => Sfx.play('unlock'));
    Bus.on('world:entered', (d) => {
      if (Sfx._entered) Sfx.play('travel');
      Sfx._entered = true;
      Sfx.startMusic(d && d.id);
    });
    Bus.on('train:rep', (d) => { if (d && !d.auto) Sfx.play('train'); });
    Bus.on('equip:changed', () => Sfx.play('equip'));
    Bus.on('shop:bought', () => Sfx.play('gem'));
    Bus.on('daily:claimed', () => Sfx.play('gem'));
    Bus.on('index:claimed', () => Sfx.play('gem'));
    Bus.on('toast', (d) => { if (d && d.kind === 'bad') Sfx.play('error'); });
    Bus.on('settings:changed', (d) => {
      if (!d) return;
      if (d.key === 'sound') Sfx.setSound(d.value);
      else if (d.key === 'music') Sfx.setMusic(d.value);
      else if (d.key === 'volume') Sfx.setVolume(d.value);
    });
  },

  /** Copies sound/music/volume from Game.player.settings (no-op when not loaded yet). */
  _readSettings() {
    try {
      const s = Game.player && Game.player.settings;
      if (!s) return;
      if (typeof s.sound === 'boolean') this._sound = s.sound;
      if (typeof s.music === 'boolean') this._music = s.music;
      if (isNum(s.volume)) this._volume = clamp(s.volume, 0, 1);
    } catch (e) { /* settings unreadable: keep defaults */ }
  },

  /** Plays a one-shot sound by name. Unknown names, sound off, no context yet: no-op. */
  play(name) {
    if (!Object.prototype.hasOwnProperty.call(_auSounds, name)) return;
    const c = this._ctx;
    if (!c || !this._sound || document.hidden || c.state !== 'running') return;
    const now = performance.now();
    const last = this._last[name];
    if (last !== undefined && now - last < 40) return;
    this._last[name] = now;
    if (this._voices >= _auMaxVoices) return;
    try { _auSounds[name](c, this._sfxG, c.currentTime + 0.01); } catch (e) { console.warn('[Sfx]', name, e); }
  },

  /** Claw motor hum loop. Idempotent; fades in/out over ~80 ms. */
  motor(on) {
    this._motorWant = !!on;
    if (!this._ctx) return;
    if (on) _auMotorStart(); else _auMotorStop();
  },

  /** Crossfades to the generative tune of a world. Remembered until the context exists. */
  startMusic(worldId) {
    const key = Object.prototype.hasOwnProperty.call(_auWorldMusic, worldId) ? worldId : 'starter';
    if (this._mWorld === key && this._mLayer) return;
    this._mWorld = key;
    if (this._ctx) _auMusicBegin(key);
  },

  setSound(b) {
    this._sound = !!b;
    if (this._ctx) _auRamp(this._ctx, this._sfxG.gain, this._sound ? 0.9 : 0);
  },

  setMusic(b) {
    this._music = !!b;
    if (!this._ctx) return;
    _auRamp(this._ctx, this._musicG.gain, this._music ? 0.25 : 0);
    if (this._music && this._mWorld && !this._mLayer) _auMusicBegin(this._mWorld);
    _auMusicRun();
  },

  /** Master volume 0..1 (smooth ramp). */
  setVolume(v) {
    this._volume = clamp(isNum(v) ? v : 0.8, 0, 1);
    if (this._ctx) _auRamp(this._ctx, this._master.gain, this._volume);
  },
};

   10_ui.js — HUD, panel frame, toasts, reveal, confirm  (see ARCHITECTURE.md §6)
   Public: UI. Private top-level names start with _ui.

/* ---------- private state ---------- */
const _ui = {
  inited: false,
  root: null,
  el: {},
  panels: {},
  panelEl: null,
  panelDef: null,
  mode: 'walk',
  disp: { coins: 0, gems: 0, strength: 0 },
  tgt: { coins: 0, gems: 0, strength: 0 },
  txt: { coins: '', gems: '', strength: '' },
  acc: { poll: 0, sec: 0, goal: 0 },
  cache: {},
  toasts: [],
  revealQ: [],
  reveal: null,
  confirm: null,
  prompt: null,
  refreshTimer: 0,
  lastRefresh: 0,
  joy: { id: null, cx: 0, cy: 0 },
  dir: { u: false, d: false, l: false, r: false },
};

const _uiEquipIcons = { dumbbell: '🏋️', kettlebell: '🔔', barbell: '🏋️', log: '🪵', iceblock: '🧊', boulder: '🪨', anvil: '⚒️', meteor: '☄️' };
const _uiStationIcons = { machine: '🕹️', training: '💪', upgrades: '⬆️', pets: '🐾', portal: '🌀' };
const _uiNav = [
  { id: 'pets', icon: '🐾', label: 'Pets', key: 'I', cls: 'btn-purple' },
  { id: 'upgrades', icon: '⬆️', label: 'Upgrades', key: 'U', cls: 'btn-green' },
  { id: 'worlds', icon: '🌍', label: 'Worlds', key: 'G', cls: 'btn-blue' },

  { id: 'shop', icon: '💎', label: 'Shop', key: 'B', cls: 'btn-pink' },
];

/* ---------- small helpers ---------- */
function _uiSfx(name) { try { if (typeof Sfx !== 'undefined' && Sfx && Sfx.play) Sfx.play(name); } catch (e) { /* ignore */ } }
function _uiSet(el, key, val, fn) {
  // write to the DOM only when the value changed
  if (_ui.cache[key] === val) return false;
  _ui.cache[key] = val;
  if (el) fn(el, val);
  return true;
}
function _uiText(el, key, val) { return _uiSet(el, key, val, (e, v) => { e.textContent = v; }); }
function _uiMachine() { try { return (typeof Machines !== 'undefined' && Machines && Machines.active) || null; } catch (e) { return null; } }
function _uiStats() { try { return Services.stats() || {}; } catch (e) { return {}; } }
function _uiRarity(animal) { try { return RARITY_BY_ID[animal.rarity] || RARITIES[0]; } catch (e) { return { id: 'common', name: 'Common', color: '#9fb3c8', order: 0 }; } }
function _uiRGB(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  const n = m ? parseInt(m[1], 16) : 0xffffff;
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function _uiRGBA(hex, a) { const c = _uiRGB(hex); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function _uiShade(hex, k) { // k < 0 darker, > 0 lighter
  const c = _uiRGB(hex).map((v) => Math.round(clamp(k >= 0 ? v + (255 - v) * k : v * (1 + k), 0, 255)));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function _uiResetVirtual() {
  try { if (typeof Input !== 'undefined' && Input && Input.virtual) { Input.virtual.x = 0; Input.virtual.y = 0; } } catch (e) { /* ignore */ }
}
function _uiPlayCost() {
  try { const w = WORLD_BY_ID[Game.player.worlds.current]; return (w && w.playCost) || 0; } catch (e) { return 0; }
}

/* =====================================================================
   UI
   ===================================================================== */
const UI = {
  currentPanel: null,

  init() {
    if (_ui.inited) return;
    _ui.inited = true;
    const root = $('#ui');
    if (!root) return;
    _ui.root = root;
    if (Game.isTouch) root.classList.add('touch');
    root.classList.add('mode-' + (Game.mode || 'walk'));
    _ui.mode = Game.mode || 'walk';
    _uiBuildHud(root);
    _uiBindInput(root);
    _uiBindBus();
    _uiSyncAll();
    // a hybrid device that gets touched switches to touch controls
    window.addEventListener('touchstart', () => { if (!root.classList.contains('touch')) { root.classList.add('touch'); _uiRenderPrompt(); } }, { passive: true, once: true });
  },

  isBlocking() { return !!(UI.currentPanel || _ui.reveal || _ui.confirm); },

  registerPanel(id, def) { if (id && def) _ui.panels[id] = def; },

  openPanel(id) {
    const def = _ui.panels[id];
    if (!def || !_ui.root) return;
    if (UI.currentPanel) _uiClosePanelNow(true);
    _uiResetHeld();
    const back = h('div', 'panel-backdrop');
    const win = h('div', 'panel-win' + (def.wide ? ' wide' : ''));
    win.setAttribute('role', 'dialog');
    const head = h('div', 'panel-head');
    head.appendChild(h('span', 'ph-icon ph-ico', esc(def.icon || '')));
    head.appendChild(h('h2', 'ph-title', esc(def.title || id)));
    const close = h('button', 'btn btn-red ph-close', '✕');
    close.setAttribute('aria-label', 'Close');
    close.addEventListener('click', () => UI.closePanel());
    head.appendChild(close);
    const body = h('div', 'panel-body');
    win.appendChild(head); win.appendChild(body); back.appendChild(win);
    back.addEventListener('pointerdown', (e) => { back._down = e.target === back; });
    back.addEventListener('click', (e) => { if (e.target === back && back._down) UI.closePanel(); });
    _ui.root.appendChild(back);
    _ui.panelEl = back; _ui.panelBody = body; _ui.panelDef = def;
    UI.currentPanel = id;
    _uiRenderPanel(false);
    try { if (def.onOpen) def.onOpen(body); } catch (e) { console.error('[UI] onOpen', id, e); }
    _uiSfx('open');
  },

  closePanel() {
    if (!UI.currentPanel) return;
    _uiClosePanelNow(false);
  },

  refreshPanel() { if (UI.currentPanel) _uiRenderPanel(true); },

  toast(text, kind = 'info') {
    if (!text || !_ui.root) return;
    const box = _ui.el.toasts;
    if (!box) return;
    const t = h('div', 'toast toast-' + (kind || 'info'));
    t.textContent = String(text);
    box.appendChild(t);
    _ui.toasts.push(t);
    while (_ui.toasts.length > 4) { const o = _ui.toasts.shift(); if (o.parentNode) o.parentNode.removeChild(o); }
    setTimeout(() => {
      t.classList.add('out');
      setTimeout(() => { if (t.parentNode) t.parentNode.removeChild(t); const i = _ui.toasts.indexOf(t); if (i >= 0) _ui.toasts.splice(i, 1); }, 260);
    }, 2600);
  },

  showReveal(pet, isNew, animal) {
    if (!pet) return;
    _ui.revealQ.push({ pet, isNew: !!isNew, animal: animal || null });
    if (!_ui.reveal) _uiRevealNext();
  },

  confirm(text, onYes) {
    if (!_ui.root) return;
    _uiCloseConfirm();
    const back = h('div', 'confirm-backdrop');
    const win = h('div', 'confirm-win');
    const p = h('div', 'confirm-text'); p.textContent = String(text || 'Are you sure?');
    const row = h('div', 'confirm-btns');
    const yes = h('button', 'btn btn-green', 'Yes');
    const no = h('button', 'btn btn-red', 'No');
    yes.addEventListener('click', () => { _uiCloseConfirm(); try { if (onYes) onYes(); } catch (e) { console.error('[UI] confirm', e); } });
    no.addEventListener('click', () => _uiCloseConfirm());
    back.addEventListener('click', (e) => { if (e.target === back) _uiCloseConfirm(); });
    row.appendChild(yes); row.appendChild(no); win.appendChild(p); win.appendChild(row); back.appendChild(win);
    _ui.root.appendChild(back);
    _ui.confirm = back;
    _uiSfx('open');
  },

  update(dt) {
    if (!_ui.inited || !_ui.root) return;
    dt = dt > 0 ? Math.min(dt, 0.25) : 0.016;
    // currency count-up
    for (const k of ['coins', 'gems', 'strength']) {
      let d = _ui.disp[k]; const t = _ui.tgt[k];
      if (d !== t) {
        d = damp(d, t, 8, dt);
        if (Math.abs(t - d) < Math.max(0.05, Math.abs(t) * 0.0005)) d = t;
        _ui.disp[k] = d;
      }
      const s = fmt(d);
      if (s !== _ui.txt[k]) { _ui.txt[k] = s; const e = _ui.el[k]; if (e) e.textContent = s; }
    }
    _ui.acc.poll += dt; _ui.acc.sec += dt; _ui.acc.goal += dt;
    if (_ui.acc.poll >= 0.1) {
      _ui.acc.poll = 0;
      if (_ui.mode === 'machine') _uiPollMachine();
      else if (_ui.mode === 'train') _uiPollTrain();
    }
    if (_ui.acc.goal >= 0.5) { _ui.acc.goal = 0; if (_ui.mode === 'walk') _uiUpdateGoal(); }
    if (_ui.acc.sec >= 1) { _ui.acc.sec = 0; _uiUpdateBoosts(); _uiUpdateBadge(); }
  },
};

/* ---------- input wiring ---------- */
function _uiResetHeld() {
  _ui.dir.u = _ui.dir.d = _ui.dir.l = _ui.dir.r = false;
  $$('.dp.pressed', _ui.root).forEach((b) => b.classList.remove('pressed'));
  _ui.joy.id = null;
  if (_ui.el.joyKnob) _ui.el.joyKnob.style.transform = '';
  _uiResetVirtual();
}

function _uiBindInput(root) {
  const el = _ui.el;
  // delegated clicks: panel openers + click sound
  root.addEventListener('click', (e) => {
    const t = e.target;
    const btn = t.closest && t.closest('button, .btn, [data-open], .pp');
    if (!btn || !root.contains(btn)) return;
    if (btn.disabled || btn.classList.contains('disabled')) return;
    if (!btn.hasAttribute('data-nosfx') && !btn.classList.contains('dp')) _uiSfx('click');
    const op = btn.closest('[data-open]');
    if (op) {
      const id = op.getAttribute('data-open');
      if (UI.currentPanel === id) UI.closePanel(); else UI.openPanel(id);
    }
  });

  // interaction prompt (desktop pill + touch round button)
  const interact = () => Bus.emit('input:action', { name: 'interact' });
  el.promptPP.addEventListener('click', interact);
  el.actionBtn.addEventListener('click', interact);

  // machine HUD
  el.mBack.addEventListener('click', () => Bus.emit('input:action', { name: 'back' }));
  el.mPlayBtn.addEventListener('click', () => Bus.emit('input:action', { name: 'primary' }));
  el.tTrain.addEventListener('click', () => Bus.emit('input:action', { name: 'primary' }));
  el.tLeave.addEventListener('click', () => Bus.emit('input:action', { name: 'back' }));

  // d-pad
  const applyDir = () => {
    const d = _ui.dir;
    try { if (typeof Input !== 'undefined' && Input.virtual) { Input.virtual.x = (d.r ? 1 : 0) - (d.l ? 1 : 0); Input.virtual.y = (d.u ? 1 : 0) - (d.d ? 1 : 0); } } catch (e) { /* ignore */ }
  };
  $$('.dp', root).forEach((b) => {
    const k = b.getAttribute('data-dir');
    const down = (e) => { e.preventDefault(); _ui.dir[k] = true; b.classList.add('pressed'); applyDir(); _uiSfx('click'); };
    const up = () => { if (!_ui.dir[k]) return; _ui.dir[k] = false; b.classList.remove('pressed'); applyDir(); };
    b.addEventListener('pointerdown', down);
    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
    b.addEventListener('contextmenu', (e) => e.preventDefault());
  });

  // joystick
  const J = _ui.joy;
  const R = 52;
  const moveKnob = (e) => {
    let dx = e.clientX - J.cx, dy = e.clientY - J.cy;
    const len = Math.hypot(dx, dy);
    if (len > R) { dx = dx / len * R; dy = dy / len * R; }
    el.joyKnob.style.transform = `translate(${dx.toFixed(1)}px,${dy.toFixed(1)}px)`;
    let vx = dx / R, vy = -dy / R;
    const m = Math.hypot(vx, vy);
    if (m < 0.12) { vx = 0; vy = 0; }
    try { if (typeof Input !== 'undefined' && Input.virtual) { Input.virtual.x = vx; Input.virtual.y = vy; } } catch (err) { /* ignore */ }
  };
  const endJoy = (e) => {
    if (J.id === null || (e && e.pointerId !== J.id)) return;
    J.id = null;
    el.joyKnob.style.transform = '';
    _uiResetVirtual();
  };
  el.joyZone.addEventListener('pointerdown', (e) => {
    if (J.id !== null) return;
    e.preventDefault();
    J.id = e.pointerId;
    const r = el.joy.getBoundingClientRect();
    J.cx = r.left + r.width / 2; J.cy = r.top + r.height / 2;
    try { el.joyZone.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    moveKnob(e);
  });
  el.joyZone.addEventListener('pointermove', (e) => { if (e.pointerId === J.id) { e.preventDefault(); moveKnob(e); } });
  el.joyZone.addEventListener('pointerup', endJoy);
  el.joyZone.addEventListener('pointercancel', endJoy);
  el.joyZone.addEventListener('lostpointercapture', endJoy);

  // training list + auto toggle
  el.tList.addEventListener('click', (e) => {
    const it = e.target.closest('[data-eq]');
    if (!it) return;
    try { const r = Remote.invoke('train:select', { id: it.getAttribute('data-eq') }); if (r && !r.ok && r.err) UI.toast(r.err, 'bad'); } catch (err) { console.error(err); }
    _uiPollTrain(true);
  });
  el.tAuto.addEventListener('click', () => {
    const p = Game.player;
    if (!p) return;
    if (!(p.shop && p.shop.autoTrain)) { UI.openPanel('shop'); return; }
    try { const r = Remote.invoke('train:auto', { on: !(p.training && p.training.auto) }); if (r && !r.ok && r.err) UI.toast(r.err, 'bad'); } catch (err) { console.error(err); }
    _uiPollTrain(true);
  });
}

/* ---------- bus wiring ---------- */
function _uiBindBus() {
  Bus.on('currency:changed', (d) => { if (d) { _ui.tgt.coins = d.coins || 0; _ui.tgt.gems = d.gems || 0; _ui.tgt.strength = d.strength || 0; } });
  Bus.on('mode:changed', (d) => _uiSetMode(d && d.mode));
  Bus.on('world:entered', () => _uiSyncWorld());
  Bus.on('world:changed', () => { _uiSyncWorld(); _uiRenderPrompt(); });
  Bus.on('toast', (d) => { if (d) UI.toast(d.text, d.kind); });
  Bus.on('reveal', (d) => { if (d && d.pet) UI.showReveal(d.pet, d.isNew, d.animal); });
  Bus.on('interact:prompt', (d) => { _ui.prompt = d && d.key ? d : null; _uiRenderPrompt(); });
  Bus.on('equip:changed', () => _uiRenderPets());
  Bus.on('pets:changed', () => _uiRenderPets());
  Bus.on('shop:bought', () => { _uiRenderPets(); });
  Bus.on('daily:claimed', () => _uiUpdateBadge());
  const refresh = () => _uiRefreshSoon();
  ['pets:changed', 'currency:changed', 'upgrade:bought', 'world:unlocked', 'world:changed', 'shop:bought', 'index:claimed', 'daily:claimed', 'equip:changed'].forEach((n) => Bus.on(n, refresh));
  Bus.on('input:action', (d) => {
    if (!d) return;
    const n = d.name;
    if (n === 'closePanel') {
      if (_ui.confirm) _uiCloseConfirm();
      else if (_ui.reveal) _uiRevealPress(true);
      else if (UI.currentPanel) UI.closePanel();
      return;
    }
    if (n === 'primary') { if (_ui.reveal) _uiRevealPress(false); return; }
    if (n && n.indexOf('panel:') === 0) {
      if (_ui.reveal || _ui.confirm) return;
      const id = n.slice(6);
      if (!_ui.panels[id]) return;
      if (UI.currentPanel === id) UI.closePanel(); else UI.openPanel(id);
    }
  });
}

function _uiSyncAll() {
  const p = Game.player;
  if (p) {
    _ui.tgt = { coins: p.coins || 0, gems: p.gems || 0, strength: p.strength || 0 };
    _ui.disp = { ..._ui.tgt };
    for (const k of ['coins', 'gems', 'strength']) { _ui.txt[k] = fmt(_ui.disp[k]); if (_ui.el[k]) _ui.el[k].textContent = _ui.txt[k]; }
  }
  _uiSyncWorld(); _uiRenderPets(); _uiUpdateBoosts(); _uiUpdateBadge(); _uiUpdateGoal(); _uiRenderPrompt();
  _uiSetMode(Game.mode || 'walk');
}

function _uiSyncWorld() {
  try {
    const w = WORLD_BY_ID[Game.player.worlds.current];
    if (!w) return;
    if (_ui.el.worldName) _ui.el.worldName.textContent = w.name;
    const acc = (w.theme && w.theme.accent) || '#ffb02e';
    document.documentElement.style.setProperty('--accent', acc);
    _ui.cache.worldId = w.id;
  } catch (e) { /* ignore */ }
}

function _uiSetMode(mode) {
  mode = mode === 'machine' || mode === 'train' ? mode : 'walk';
  const root = _ui.root;
  if (!root) return;
  root.classList.remove('mode-walk', 'mode-machine', 'mode-train');
  root.classList.add('mode-' + mode);
  _ui.mode = mode;
  _uiResetHeld();
  _ui.cache.m = {}; _ui.cache.t = {};
  if (mode === 'machine') { _ui.cache.msig = ''; _uiPollMachine(true); }
  else if (mode === 'train') { _uiPollTrain(true); }
  else { _uiUpdateGoal(); _uiRenderPets(); _uiRenderPrompt(); }
}

/* ---------- currency / goal / boosts / badge ---------- */
function _uiUpdateGoal() {
  let g = null;
  try { g = Services.nextGoal(); } catch (e) { /* ignore */ }
  if (!g) return;
  _uiText(_ui.el.goalText, 'goalText', g.text || '');
  const w = Math.round(clamp(g.progress || 0, 0, 1) * 100) + '%';
  _uiSet(_ui.el.goalFill, 'goalW', w, (e, v) => { e.style.width = v; });
}

function _uiUpdateBoosts() {
  const p = Game.player, box = _ui.el.boosts;
  if (!p || !box) return;
  const now = Date.now(), b = p.boosts || {};
  let sig = '', html = '';
  const add = (cls, ico, name, until) => {
    if (until > now) { const s = `${ico} ${name} ${fmtDur((until - now) / 1000)}`; sig += s + '|'; html += `<span class="boost-chip ${cls}">${esc(s)}</span>`; }
  };
  add('boost-luck', '🍀', 'Luck', b.luck || 0);
  add('boost-coins', '🪙', 'Coins', b.coins || 0);
  _uiSet(box, 'boosts', sig, (e) => { e.innerHTML = html; });
}

function _uiUpdateBadge() {
  let ready = false;
  try { const d = Services.dailyInfo(); ready = !!(d && d.ready); } catch (e) { /* ignore */ }
  _uiSet(_ui.el.shopBadge, 'badge', ready, (e, v) => { e.hidden = !v; });
}

/* ---------- pets bar ---------- */
function _uiRenderPets() {
  const box = _ui.el.slots;
  if (!box || !Game.player) return;
  const st = _uiStats();
  const n = Math.max(1, st.equipSlots || 1);
  const p = Game.player;
  const parts = [];
  for (let i = 0; i < n; i++) {
    const uid = p.equipped && p.equipped[i];
    const pet = uid ? (p.pets || []).find((x) => x.uid === uid) : null;
    parts.push(pet ? pet.id + ':' + pet.variant : '-');
  }
  const sig = parts.join(',');
  if (_ui.cache.petsSig !== sig) {
    _ui.cache.petsSig = sig;
    box.innerHTML = '';
    for (let i = 0; i < n; i++) {
      const uid = p.equipped && p.equipped[i];
      const pet = uid ? (p.pets || []).find((x) => x.uid === uid) : null;
      const animal = pet && ANIMAL_BY_ID[pet.id];
      const s = h('div', 'pslot');
      if (animal) {
        const r = _uiRarity(animal);
        s.classList.add('r-' + r.id);
        let src = '';
        try { src = AnimalFactory.thumbnail(pet.id, pet.variant); } catch (e) { /* ignore */ }
        if (src) { const im = h('img'); im.src = src; im.alt = animal.name; im.draggable = false; s.appendChild(im); }
        else s.textContent = '🐾';
        if (pet.variant === 'golden') s.appendChild(h('span', 'pv', '✨'));
        else if (pet.variant === 'rainbow') s.appendChild(h('span', 'pv', '🌈'));
        s.title = animal.name;
      } else { s.classList.add('empty'); s.textContent = '+'; }
      box.appendChild(s);
    }
  }
  _uiText(_ui.el.petsMult, 'petsMult', '🐾 ' + fmtMult(st.petMult || 1));
}

/* ---------- interaction prompt ---------- */
function _uiRenderPrompt() {
  const pr = _ui.prompt, el = _ui.el;
  if (!el.prompt) return;
  if (!pr) {
    el.prompt.hidden = true; el.action.hidden = true;
    _ui.cache.promptSig = '';
    return;
  }
  let label = pr.label || '';
  let sub = '';
  if (pr.key === 'machine') {
    const c = _uiPlayCost();
    sub = c > 0 ? '🪙 ' + fmt(c) : 'Free';
  }
  const sig = pr.key + '|' + label + '|' + sub;
  el.prompt.hidden = false; el.action.hidden = false;
  if (_ui.cache.promptSig === sig) return;
  _ui.cache.promptSig = sig;
  el.promptPP.innerHTML = `<kbd>E</kbd><span>${esc(label)}${sub ? ' <span class="muted" style="color:#ffe27a">(' + esc(sub) + ')</span>' : ''}</span>`;
  el.actionIco.textContent = _uiStationIcons[pr.key] || '✋';
  el.actionTxt.textContent = label;
  el.actionSub.textContent = sub ? '(' + sub + ')' : '';
  el.actionSub.hidden = !sub;
}

/* =====================================================================
   Machine HUD
   ===================================================================== */
function _uiPollMachine(force) {
  const m = _uiMachine(), el = _ui.el;
  const state = m ? m.state : 'idle';
  const busy = m ? !!(m.isBusy && m.isBusy()) : false;
  _uiSet(el.mBack, 'm.back', busy, (e, v) => { e.disabled = v; });

  // timer
  const aim = state === 'aim';
  const tl = m && aim ? Math.max(0, Math.ceil(m.timeLeft || 0)) : 0;
  _uiSet(el.mTimer, 'm.timerShow', aim, (e, v) => { e.hidden = !v; });
  if (aim) {
    _uiText(el.mTimerNum, 'm.timerNum', String(tl));
    _uiSet(el.mTimerPill, 'm.urgent', tl <= 5, (e, v) => e.classList.toggle('urgent', v));
  }

  // play / drop button
  let mode = 'hide', txt = '', sub = '', reason = '', ok = true;
  if (m && state === 'idle') {
    let cs = null;
    try { cs = m.canStart(); } catch (e) { cs = { ok: true, cost: 0 }; }
    ok = !!(cs && cs.ok);
    mode = 'play'; txt = 'PLAY';
    const cost = cs && cs.cost != null ? cs.cost : _uiPlayCost();
    sub = cost > 0 ? '🪙 ' + fmt(cost) : 'FREE';
    if (!ok) reason = (cs && cs.err) || 'Cannot play now';
  } else if (m && aim) { mode = 'drop'; txt = 'DROP'; }
  const psig = mode + '|' + txt + '|' + sub + '|' + ok + '|' + reason;
  if (_uiSet(el.mPlay, 'm.play', psig, () => {
    el.mPlay.hidden = mode === 'hide';
    el.mPlayBtn.classList.toggle('red', mode === 'drop');
    el.mPlayBtn.disabled = mode === 'play' && !ok;
    el.mPlayTxt.textContent = txt; el.mPlaySub.textContent = sub; el.mPlaySub.hidden = !sub;
    el.mReason.textContent = reason; el.mReason.hidden = !reason;
  })) { /* applied */ }

  // hover card
  let hv = null;
  if (m && (state === 'aim' || state === 'idle') && m.getHover) { try { hv = m.getHover(); } catch (e) { hv = null; } }
  if (!hv || !hv.animal) {
    _uiSet(el.mHover, 'm.hvSig', '', (e) => { e.hidden = true; });
  } else {
    const entry = hv.entry || {}, an = hv.animal;
    const pct = Math.round(clamp(hv.chance || 0, 0, 1) * 100);
    const sig = (entry.pid || an.id) + '|' + entry.variant + '|' + pct;
    _uiSet(el.mHover, 'm.hvSig', sig, (e) => {
      const r = _uiRarity(an);
      e.hidden = false;
      e.className = 'hud hud-hover only-machine r-' + r.id;
      el.hvName.textContent = an.name;
      el.hvRar.textContent = r.name; el.hvRar.className = 'tag r-' + r.id;
      const v = entry.variant;
      if (v && v !== 'normal') { el.hvVar.hidden = false; el.hvVar.textContent = v === 'golden' ? '✨ Golden' : v === 'rainbow' ? '🌈 Rainbow' : v; el.hvVar.className = 'tag'; }
      else el.hvVar.hidden = true;
      let mult = an.mult || 1;
      try { mult = Services.petMultOf({ id: an.id, variant: v || 'normal' }); } catch (err) { /* ignore */ }
      el.hvMult.textContent = fmtMult(mult);
      el.hvPct.textContent = pct + '%';
      el.hvBar.className = 'bar ' + (pct >= 65 ? 'g-good' : pct >= 35 ? 'g-mid' : 'g-bad');

function _uiRevealNext() {
  if (_ui.reveal || !_ui.revealQ.length || !_ui.root) return;
  const it = _ui.revealQ.shift();
  const pet = it.pet;
  const animal = it.animal || ANIMAL_BY_ID[pet.id];
  if (!animal) { _uiRevealNext(); return; }
  const rar = _uiRarity(animal);
  const order = rar.order != null ? rar.order : 0;
  const big = order >= 4;
  const col = rar.id === 'secret' ? '#d46bff' : rar.color;

  ov.style.setProperty('--rcB', _uiRGBA(col, 0.75));
  ov.style.setProperty('--rcL', _uiShade(col, 0.45));
  ov.style.setProperty('--rcS', col);
  ov.style.setProperty('--rcD', _uiShade(col, -0.35));
  ov.style.setProperty('--rg', col);
  let variantTag = '';

  else if (pet.variant === 'rainbow') variantTag = '<span class="rv-var rainbow">🌈 Rainbow</span>';
  let mult = animal.mult || 1;
  try { mult = Services.petMultOf(pet); } catch (e) { /* ignore */ }
  ov.innerHTML =
    '<div class="rv-rays"></div>' +
    '<div class="rv-stage"><div class="rv-burst"></div><div class="rv-cap"><div class="half top"></div><div class="half bot"></div></div><div class="rv-viewer"></div></div>' +
    '<div class="rv-info">' + (it.isNew ? '<div class="rv-new">NEW!</div>' : '') +
    `<div class="rv-name">${esc(animal.name)}</div><div class="rv-rar">${esc(rar.name)}</div>${variantTag}` +
    `<div class="rv-mult">${esc(fmtMult(mult))} <small>pet multiplier</small></div>` +
    '<button class="btn btn-green btn-lg rv-btn" data-nosfx="1">Awesome!</button></div>' +
    '<div class="rv-flash"></div><div class="rv-tip">Tap to skip</div>';
  // floating particles for the top rarities
  if (order >= 4) {
    const n = order >= 6 ? 26 : order >= 5 ? 20 : 12;
    const syms = rar.id === 'secret' ? ['✦', '★', '✧', '❖'] : ['✦', '★', '✧'];
    for (let i = 0; i < n; i++) {
      const s = h('span', 'rv-p', syms[i % syms.length]);
      s.style.left = (Math.random() * 100).toFixed(1) + '%';
      s.style.setProperty('--d', (4 + Math.random() * 4).toFixed(1) + 's');
      s.style.setProperty('--dl', (-Math.random() * 6).toFixed(1) + 's');
      s.style.fontSize = (14 + Math.random() * 22).toFixed(0) + 'px';
      s.style.color = rar.id === 'secret' ? ['#ff6a6a', '#ffd23f', '#6df06a', '#6cc4ff', '#d46bff'][i % 5] : col;
      ov.appendChild(s);
    }
  }
  _ui.root.appendChild(ov);

  const rv = { ov, pet, animal, rar, order, big, timers: [], opened: false, closable: false, mounted: false };
  rv.cap = $('.rv-cap', ov); rv.viewer = $('.rv-viewer', ov); rv.info = $('.rv-info', ov);
  rv.btn = $('.rv-btn', ov); rv.flash = $('.rv-flash', ov); rv.burst = $('.rv-burst', ov); rv.tip = $('.rv-tip', ov);
  _ui.reveal = rv;
  _uiResetHeld();
  const later = (ms, fn) => { rv.timers.push(setTimeout(fn, ms)); };
  rv.later = later;

  ov.addEventListener('click', (e) => {
    if (e.target.closest('.rv-btn')) { _uiRevealPress(true); return; }
    _uiRevealPress(false);
  });

  // timeline
  const shakes = big ? 4 : 2;
  const shakeMs = big ? 700 : 480;
  const gap = big ? 160 : 120;
  later(40, () => { rv.cap.classList.add('drop'); });
  if (big) later(60, () => ov.classList.add('glow'));
  let t = 720;
  for (let i = 0; i < shakes; i++) {
    const k = i;
    later(t, () => {
      rv.cap.classList.remove('drop'); rv.cap.classList.remove('shake'); void rv.cap.offsetWidth;
      rv.cap.style.setProperty('--sd', shakeMs + 'ms');
      rv.cap.style.setProperty('--glow', (big ? 10 + k * 16 : 8 + k * 6) + 'px');
      rv.cap.classList.add('shake');
      _uiSfx('capsule');
      if (big && k === shakes - 1) ov.classList.add('glow');
    });
    t += shakeMs + gap;
  }
  later(t + 60, () => _uiRevealOpen(rv));
}

function _uiRevealOpen(rv) {
  if (rv.opened || _ui.reveal !== rv) return;
  rv.opened = true;
  rv.timers.forEach(clearTimeout); rv.timers = [];
  const later = rv.later;
  const { ov, cap, rar, order } = rv;
  cap.classList.remove('drop', 'shake'); cap.style.transform = 'none'; cap.style.setProperty('--glow', '30px');
  void cap.offsetWidth;
  cap.classList.add('open');
  ov.classList.add('glow', 'opened');
  rv.burst.classList.add('go');
  if (rv.big) { rv.flash.classList.add('go'); }
  _uiSfx('reveal');
  if (order >= 2) _uiSfx(rar.id);
  rv.tip.hidden = true;
  later(120, () => {
    try { if (typeof PetViewer !== 'undefined') { PetViewer.mount(rv.viewer, rv.pet.id, rv.pet.variant || 'normal'); rv.mounted = true; } } catch (e) { console.error('[UI] PetViewer', e); }
    rv.viewer.classList.add('show');
  });
  later(450, () => { rv.info.classList.add('show'); rv.btn.classList.add('show'); });
  later(800, () => { rv.closable = true; });
}

function _uiRevealPress(forceClose) {
  const rv = _ui.reveal;
  if (!rv) return;
  if (!rv.opened) { _uiRevealOpen(rv); return; }
  if (!rv.closable && !forceClose) return;
  if (!rv.closable) return;
  _uiRevealClose(rv);
}

function _uiRevealClose(rv) {
  rv.timers.forEach(clearTimeout); rv.timers = [];
  try { if (rv.mounted && typeof PetViewer !== 'undefined') PetViewer.unmount(); } catch (e) { /* ignore */ }
  rv.ov.classList.add('closing');
  _ui.reveal = null;
  _uiSfx('close');
  setTimeout(() => { if (rv.ov.parentNode) rv.ov.parentNode.removeChild(rv.ov); }, 260);
  setTimeout(() => { if (!_ui.reveal) _uiRevealNext(); }, 280);
}

function _upUpgradeCard(u, unlockedCount) {
  const pl = Game.player;
  const lvl = pl.upgrades[u.id] || 0;
  const worldOk = pl.worlds.unlocked.includes(u.world);
  const cap = Math.min(FORMULAS.upgradeCap(u.id, unlockedCount), u.maxLevel);
  const atMax = lvl >= u.maxLevel;
  const atCap = !atMax && lvl >= cap;
  const c = h('div', 'card pn-up' + (worldOk ? '' : ' locked') + (_upS.pulse === u.id ? ' pulse' : ''));
  c.dataset.up = u.id;
  const ico = h('div', 'pn-up-ico', u.icon || '⬆️');
  c.appendChild(ico);
  const mid = h('div', 'pn-up-mid');
  mid.innerHTML = '<div class="pn-up-name">' + esc(u.name) + '</div><div class="muted pn-up-desc">' + esc(u.desc) + '</div>';
  const cur = FORMULAS.formatUpgrade(u.id, FORMULAS.upgradeValue(u.id, lvl));
  if (worldOk) {
    const lv = h('div', 'pn-up-lv');
    lv.innerHTML = '<span class="pill">Lv ' + lvl + ' / ' + cap + '</span><span class="muted"> (max ' + u.maxLevel + ')</span>';
    mid.appendChild(lv);
    const bar = h('div', 'bar pn-up-bar'); bar.innerHTML = '<i style="width:' + Math.round(100 * lvl / u.maxLevel) + '%"></i>';
    mid.appendChild(bar);
    const val = h('div', 'pn-up-val');
    if (atMax) val.innerHTML = '<b>' + esc(cur) + '</b>';
    else val.innerHTML = '<span>' + esc(cur) + '</span> <em>→</em> <b>' + esc(FORMULAS.formatUpgrade(u.id, FORMULAS.upgradeValue(u.id, lvl + 1))) + '</b>';
    mid.appendChild(val);
  }
  c.appendChild(mid);
  const act = h('div', 'pn-up-act');
  if (!worldOk) {
    act.appendChild(h('div', 'pn-lockmsg', '🔒 Unlocks in<br><b>' + esc(_upWorldName(u.world)) + '</b>'));
  } else if (atMax) {
    act.appendChild(h('div', 'pn-maxtag', 'MAX'));
  } else if (atCap) {
    act.appendChild(h('div', 'pn-capmsg', 'Unlock the next world to raise the cap'));
  } else {
    const cost = FORMULAS.upgradeCost(u.id, lvl);
    const bal = u.currency === 'gems' ? pl.gems : pl.coins;
    const ok = bal >= cost;
    const sym = u.currency === 'gems' ? '💎' : '🪙';
    act.appendChild(_upBtn('Upgrade<br><span class="pn-cost">' + sym + ' ' + _upNum(cost) + '</span>', ok ? 'btn-green' : 'btn-gray', () => {
      const res = _upCall('upgrade:buy', { id: u.id });
      if (res.ok) { _upS.pulse = u.id; try { Sfx.play('upgrade'); } catch (e) { /* */ } }
      _upRefresh();
    }, !ok));
  }
  c.appendChild(act);
  return c;
}
function _upRenderUpgrades(body) {
  const pl = Game.player;
  const st = Services.stats();
  const world = WORLD_BY_ID[pl.worlds.current] || WORLDS[0];

function _upShopOwned(it) {
  const s = Game.player.shop;
  switch (it.kind) {
    case 'equipSlot': return s.equipSlots || 0;
    case 'invSlots': return s.invSlots || 0;
    case 'autoTrain': return s.autoTrain ? 1 : 0;
    default: return 0;
  }
}
function _upBoostLeft(it) {
  const b = Game.player.boosts || {};
  const exp = it.kind === 'boostLuck' ? b.luck : it.kind === 'boostCoins' ? b.coins : 0;
  return exp > Date.now() ? (exp - Date.now()) / 1000 : 0;
}

    }));
    else {

function _upCopy(ta) {
  const done = () => UI.toast('Copied to clipboard', 'good');
  ta.focus(); ta.select();
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(ta.value).then(done, () => { try { document.execCommand('copy'); done(); } catch (e) { UI.toast('Select the text and copy it', 'info'); } }); return; }
  } catch (e) { /* fall through */ }
  try { document.execCommand('copy'); done(); } catch (e) { UI.toast('Select the text and copy it', 'info'); }
}

    const ex = h('textarea', 'pn-ta'); ex.readOnly = true; ex.rows = 3; ex.spellcheck = false;
    try { ex.value = SaveService.exportCode(); } catch (e) { ex.value = ''; }
    ex.addEventListener('focus', () => ex.select());
    sv.appendChild(ex);
    sv.appendChild(_upBtn('📋 Copy', 'btn-blue btn-sm', () => _upCopy(ex)));

    sv.appendChild(h('div', 'pn-sub', 'Import save'));
    const im = h('textarea', 'pn-ta'); im.rows = 3; im.spellcheck = false; im.placeholder = 'Paste a save code here…'; im.value = _upS.importText;
    im.addEventListener('input', () => { _upS.importText = im.value; });
    sv.appendChild(im);
    sv.appendChild(_upBtn('Import', 'btn-yellow btn-sm', () => {
      const text = im.value.trim();
      if (!text) { UI.toast('Paste a save code first', 'bad'); return; }
      UI.confirm('Importing replaces your current progress. Continue?', () => {
        const res = SaveService.importCode(text);
        if (res && res.ok) location.reload();
        else UI.toast((res && res.err) || 'Invalid save code', 'bad');
      });
    }));
    root.appendChild(sv);

    const dz = _upSection('⚠️ Danger zone');
    dz.appendChild(_upBtn('Reset progress', 'btn-red', () => {
      UI.confirm('Reset ALL progress? This cannot be undone!', () => {
        UI.confirm('Are you really sure? Everything will be deleted.', () => { SaveService.reset(); location.reload(); });
      });
    }));
    root.appendChild(dz);

    const ct = _upSection('🎮 Controls');
    const rows = Game.isTouch
      ? [['Move', 'Joystick / D-pad'], ['Action button', 'Interact / drop / train'], ['Aim claw', 'Tap or drag in the machine'], ['Menu buttons', 'Open panels']]
      : [['Move', 'W A S D / Arrow keys'], ['Interact', 'E'], ['Drop claw / Train', 'Space'], ['Back / close', 'Esc'], ['Pets', 'I'], ['Upgrades', 'U'], ['Worlds', 'G'], ['Index', 'X'], ['Shop', 'B'], ['Settings', 'O']];
    const tb = h('div', 'pn-keys');
    const all = Game.isTouch ? rows.concat([['Keyboard', 'WASD / E / Space / Esc / I U G X B O']]) : rows.concat([['Touch', 'Joystick, action button, D-pad, tap/drag in machine']]);
    for (const [k, v] of all) tb.appendChild(h('div', 'pn-keyrow', '<span>' + esc(k) + '</span><b>' + esc(v) + '</b>'));
    ct.appendChild(tb);
    root.appendChild(ct);

    const s = pl.stats || {};
    const best = s.bestRarity ? _upRar(s.bestRarity).name : '—';
    const stc = _upSection('📊 Stats');
    const sg = h('div', 'pn-statgrid');
    const SI = (l, v) => '<div><small>' + l + '</small><b>' + v + '</b></div>';
    sg.innerHTML = SI('Plays', _upNum(s.plays || 0)) + SI('Wins', _upNum(s.wins || 0)) + SI('Slips', _upNum(s.slips || 0)) + SI('Misses', _upNum(s.misses || 0)) +
      SI('Reps', _upNum(s.reps || 0)) + SI('Best rarity', esc(best)) + SI('Play time', fmtDur(s.playTime || 0));
    stc.appendChild(sg);
    root.appendChild(stc);
    body.appendChild(root);
  });
}
