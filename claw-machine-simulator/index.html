/* =====================================================================
   02_data.js — PlayerData (defaults + validation) and SaveService
   ===================================================================== */

const _sdMAXNUM = 1e300;
const _sdMAXPETS = 5000;

function _sdNum(v, def = 0) { return isNum(v) && v >= 0 ? Math.min(v, _sdMAXNUM) : def; }
function _sdInt(v, lo, hi, def = lo) {
  if (!isNum(v)) return def;
  return clamp(Math.floor(v), lo, hi);
}
function _sdBool(v, def) { return typeof v === 'boolean' ? v : def; }
function _sdKeys(o) { return isObj(o) ? Object.keys(o) : []; }
function _sdHas(map, k) { return typeof k === 'string' && Object.prototype.hasOwnProperty.call(map, k); }

/** Upgrades older save data to the current version (currently identity). */
function _sdMigrate(data) {
  if (!isObj(data)) return data;
  // let v = isNum(data.version) ? data.version : 1;
  // if (v < 2) { ...; v = 2; }
  return data;
}

function _sdInvSlotsMax() {
  try {
    const it = GEM_SHOP.find((g) => g && g.kind === 'invSlots');
    if (it && isNum(it.max) && it.max >= 0) return Math.floor(it.max);
  } catch (e) { /* ignore */ }
  return 20;
}

function _sdValidPit(list) {
  const out = [];
  if (!Array.isArray(list)) return out;
  const seen = new Set();
  for (const e of list) {
    if (out.length >= ECONOMY.pitMax) break;
    if (!isObj(e) || !_sdHas(ANIMAL_BY_ID, e.id) || !_sdHas(VARIANTS, e.variant)) continue;
    let pid = e.pid;
    if (!isStr(pid) || seen.has(pid)) pid = uid('a');
    seen.add(pid);
    out.push({ pid, id: e.id, variant: e.variant });
  }
  return out;
}

const PlayerData = {
  create() {
    const upgrades = {};
    for (const u of UPGRADES) upgrades[u.id] = 0;
    const machines = {};
    for (const w of WORLDS) machines[w.id] = { pit: [], plays: 0 };
    return {
      version: 1,
      createdAt: Date.now(), lastSaved: 0,
      coins: ECONOMY.startCoins, gems: ECONOMY.startGems, strength: 0,
      pets: [],
      equipped: [],
      upgrades,
      worlds: { unlocked: ['starter'], current: 'starter' },
      machines,
      discovered: {},
      indexClaimed: {},
      shop: { equipSlots: 0, invSlots: 0, autoTrain: false },
      boosts: { luck: 0, coins: 0 },
      training: { selected: TRAINING_EQUIPMENT[0].id, auto: false },
      daily: { last: 0, streak: 0 },
      stats: { plays: 0, wins: 0, slips: 0, misses: 0, reps: 0, coinsEarned: 0, bestRarity: null, playTime: 0 },
      settings: { quality: 'auto', sound: true, music: true, volume: 0.8 },
    };
  },

  validate(raw) {
    const d = PlayerData.create();
    try {
      if (!isObj(raw)) return d;
      raw = _sdMigrate(raw);
      if (!isObj(raw)) return d;
      const r = raw;

      d.createdAt = _sdNum(r.createdAt, d.createdAt);
      d.lastSaved = _sdNum(r.lastSaved, 0);
      d.coins = _sdNum(r.coins, d.coins);
      d.gems = _sdNum(r.gems, d.gems);
      d.strength = _sdNum(r.strength, 0);

      // shop (needed for equip slots)
      const rs = isObj(r.shop) ? r.shop : {};
      d.shop.equipSlots = _sdInt(rs.equipSlots, 0, Math.max(0, ECONOMY.maxEquipSlots - ECONOMY.baseEquipSlots), 0);
      d.shop.invSlots = _sdInt(rs.invSlots, 0, _sdInvSlotsMax(), 0);
      d.shop.autoTrain = _sdBool(rs.autoTrain, false);

      // pets
      const seenUid = new Set();
      if (Array.isArray(r.pets)) {
        for (const p of r.pets) {
          if (d.pets.length >= _sdMAXPETS) break;
          if (!isObj(p) || !_sdHas(ANIMAL_BY_ID, p.id) || !_sdHas(VARIANTS, p.variant)) continue;
          let u = p.uid;
          if (!isStr(u) || seenUid.has(u)) u = uid('p');
          seenUid.add(u);
          d.pets.push({ uid: u, id: p.id, variant: p.variant, locked: p.locked === true, t: isNum(p.t) ? p.t : 0 });
        }
      }

      // equipped
      const slots = Math.max(0, Math.floor(ECONOMY.baseEquipSlots + d.shop.equipSlots));
      if (Array.isArray(r.equipped)) {
        const eq = new Set();
        for (const u of r.equipped) {
          if (d.equipped.length >= slots) break;
          if (typeof u === 'string' && seenUid.has(u) && !eq.has(u)) { eq.add(u); d.equipped.push(u); }
        }
      }

      // upgrades
      const ru = isObj(r.upgrades) ? r.upgrades : {};
      for (const u of UPGRADES) d.upgrades[u.id] = _sdInt(ru[u.id], 0, Math.max(0, Math.floor(u.maxLevel)), 0);

      // worlds
      const rw = isObj(r.worlds) ? r.worlds : {};
      const unl = new Set(['starter']);
      if (Array.isArray(rw.unlocked)) for (const w of rw.unlocked) if (_sdHas(WORLD_BY_ID, w)) unl.add(w);
      d.worlds.unlocked = WORLDS.map((w) => w.id).filter((id) => unl.has(id));
      if (!d.worlds.unlocked.includes('starter')) d.worlds.unlocked.unshift('starter');
      d.worlds.current = typeof rw.current === 'string' && d.worlds.unlocked.includes(rw.current) ? rw.current : 'starter';

      // machines
      const rm = isObj(r.machines) ? r.machines : {};
      for (const w of WORLDS) {
        const m = isObj(rm[w.id]) ? rm[w.id] : {};
        d.machines[w.id] = { pit: _sdValidPit(m.pit), plays: _sdInt(m.plays, 0, Number.MAX_SAFE_INTEGER, 0) };
      }

      // index
      const rd = isObj(r.discovered) ? r.discovered : {};
      for (const k of _sdKeys(rd)) if (_sdHas(ANIMAL_BY_ID, k) && isNum(rd[k]) && rd[k] >= 0) d.discovered[k] = Math.floor(Math.min(rd[k], Number.MAX_SAFE_INTEGER));
      const ri = isObj(r.indexClaimed) ? r.indexClaimed : {};
      for (const k of _sdKeys(ri)) if (_sdHas(WORLD_BY_ID, k) && ri[k] === true) d.indexClaimed[k] = true;

      // boosts / training
      const rb = isObj(r.boosts) ? r.boosts : {};
      d.boosts.luck = _sdNum(rb.luck, 0);
      d.boosts.coins = _sdNum(rb.coins, 0);
      const rt = isObj(r.training) ? r.training : {};
      if (typeof rt.selected === 'string' && _sdHas(EQUIPMENT_BY_ID, rt.selected)) d.training.selected = rt.selected;
      d.training.auto = d.shop.autoTrain && rt.auto === true;

      // daily
      const rdl = isObj(r.daily) ? r.daily : {};
      d.daily.last = _sdNum(rdl.last, 0);
      d.daily.streak = _sdInt(rdl.streak, 0, Number.MAX_SAFE_INTEGER, 0);

      // stats
      const rst = isObj(r.stats) ? r.stats : {};
      for (const k of ['plays', 'wins', 'slips', 'misses', 'reps', 'coinsEarned', 'playTime']) d.stats[k] = _sdNum(rst[k], 0);
      d.stats.bestRarity = typeof rst.bestRarity === 'string' && _sdHas(RARITY_BY_ID, rst.bestRarity) ? rst.bestRarity : null;

      // settings
      const rse = isObj(r.settings) ? r.settings : {};
      if (['auto', 'low', 'medium', 'high'].includes(rse.quality)) d.settings.quality = rse.quality;
      d.settings.sound = _sdBool(rse.sound, true);
      d.settings.music = _sdBool(rse.music, true);
      d.settings.volume = isNum(rse.volume) ? clamp(rse.volume, 0, 1) : 0.8;

      d.version = 1;
      return d;
    } catch (e) {
      console.warn('[PlayerData.validate] failed, using what was sanitized so far', e);
      try { return PlayerData.validate(null); } catch (e2) { return d; }
    }
  },
};

/* ---------- save envelope helpers ---------- */
function _sdChecksum(str) {
  let hv = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    hv ^= str.charCodeAt(i);
    hv = Math.imul(hv, 0x01000193) >>> 0;
  }
  return (hv >>> 0).toString(16).padStart(8, '0');
}
function _sdPack(data) { return JSON.stringify({ v: 1, sum: _sdChecksum(JSON.stringify(data)), data }); }
/** string -> raw data object when the envelope + checksum are intact, else null. */
function _sdUnpack(str) {
  try {
    if (typeof str !== 'string' || !str) return null;
    const env = JSON.parse(str);
    if (!isObj(env) || !isObj(env.data) || typeof env.sum !== 'string') return null;
    if (env.sum !== _sdChecksum(JSON.stringify(env.data))) return null;
    return env.data;
  } catch (e) { return null; }
}
function _sdToB64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function _sdFromB64(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

const SaveService = {
  KEY: 'clawsim_save_v1',
  BACKUP_KEY: 'clawsim_save_v1_bak',
  recovered: false,
  _locked: false,        // set by reset()/importCode(): no more writes this page life
  _warned: false,
  _autosaveOn: false,
  _lastBackup: 0,
  _debounce: null,

  _get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },

  load() {
    this.recovered = false;
    const main = this._get(this.KEY);
    let data = _sdUnpack(main);
    if (data) return PlayerData.validate(data);
    if (main != null) console.warn('[SaveService] main save is corrupt');
    const bak = this._get(this.BACKUP_KEY);
    data = _sdUnpack(bak);
    if (data) {
      console.warn('[SaveService] restored from backup save');
      this.recovered = true;
      return PlayerData.validate(data);
    }
    if (main != null || bak != null) console.warn('[SaveService] no usable save, starting fresh');
    return PlayerData.create();
  },

  save(reason) {
    if (this._locked || !Game.player) return false;
    try {
      const now = Date.now();
      Game.player.lastSaved = now;
      const str = _sdPack(Game.player);
      const prev = localStorage.getItem(this.KEY);
      if (prev && now - this._lastBackup >= 60000 && _sdUnpack(prev)) {
        localStorage.setItem(this.BACKUP_KEY, prev);
        this._lastBackup = now;
      }
      localStorage.setItem(this.KEY, str);
      Bus.emit('save:done', { time: now });
      return true;
    } catch (e) {
      if (!this._warned) {
        this._warned = true;
        console.warn('[SaveService] save failed', e);
        Bus.emit('toast', { text: 'Could not save (storage unavailable)', kind: 'bad' });
      }
      return false;
    }
  },

  startAutosave() {
    if (this._autosaveOn) return;
    this._autosaveOn = true;
    setInterval(() => this.save('interval'), 15000);
    Bus.on('save:request', (d) => {
      if (this._debounce) clearTimeout(this._debounce);
      this._debounce = setTimeout(() => { this._debounce = null; this.save((d && d.reason) || 'request'); }, 1000);
    });
    if (typeof document !== 'undefined') {
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') this.save('hidden'); });
    }
    if (typeof window !== 'undefined') {
      window.addEventListener('pagehide', () => this.save('pagehide'));
      window.addEventListener('beforeunload', () => this.save('unload'));
    }
  },

  exportCode() {
    try {
      if (Game.player) Game.player.lastSaved = Date.now();
      return _sdToB64(_sdPack(PlayerData.validate(Game.player)));
    } catch (e) { return ''; }
  },

  importCode(str) {
    const bad = { ok: false, err: 'Invalid save code' };
    try {
      if (typeof str !== 'string') return bad;
      const code = str.replace(/\s+/g, '');
      if (!code) return bad;
      const data = _sdUnpack(_sdFromB64(code));
      if (!data) return bad;
      const packed = _sdPack(PlayerData.validate(data));
      this._locked = true;           // block pagehide autosave from overwriting the import
      if (this._debounce) { clearTimeout(this._debounce); this._debounce = null; }
      try {
        const old = localStorage.getItem(this.KEY);
        if (old) localStorage.setItem(this.BACKUP_KEY, old);
        localStorage.setItem(this.KEY, packed);
      } catch (e) {
        this._locked = false;
        return { ok: false, err: 'Could not store the save (storage unavailable)' };
      }
      return { ok: true };
    } catch (e) { return bad; }
  },

  reset() {
    this._locked = true;
    if (this._debounce) { clearTimeout(this._debounce); this._debounce = null; }
    try { localStorage.removeItem(this.KEY); localStorage.removeItem(this.BACKUP_KEY); } catch (e) { /* ignore */ }
  },
};

/* ==== 03_services.js ==== */
/* =====================================================================
   03_services.js — "server" rules: Remote (action dispatcher) + Services.
   No DOM, no Three.js. Reads/writes Game.player, talks via Bus + return values.
   ===================================================================== */

/* ---------- private helpers ---------- */
const _svPlays = {};            // playId -> { worldId, started }
let _svLastRep = -1e9;             // performance.now() of last manual rep
let _svAutoT = 0;               // auto-train accumulator
let _svBoostLive = { luck: false, coins: false };

function _svFail(err) { return { ok: false, err }; }
function _svNow() { return (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now(); }
function _svP() { return Game.player; }
function _svSave(reason) { Bus.emit('save:request', { reason }); }
function _svToast(text, kind = 'info') { Bus.emit('toast', { text, kind }); }
function _svCurrency() { const p = _svP(); Bus.emit('currency:changed', { coins: p.coins, gems: p.gems, strength: p.strength }); }
function _svReward(coins, gems, strength, source) { Bus.emit('reward', { coins, gems, strength, source }); }
function _svFloor(n) { return isNum(n) ? Math.max(0, n) : 0; }
function _svWorld(id) { return WORLD_BY_ID[id || _svP().worlds.current]; }
function _svMachine(worldId) {
  const p = _svP();
  let m = p.machines[worldId];
  if (!isObj(m)) m = p.machines[worldId] = { pit: [], plays: 0 };
  if (!Array.isArray(m.pit)) m.pit = [];
  if (!isNum(m.plays)) m.plays = 0;
  return m;
}
function _svPet(uid) { return _svP().pets.find((x) => x.uid === uid) || null; }
function _svRarityOrder(id) { const r = RARITY_BY_ID[id]; return r ? r.order : 0; }
function _svBoostItem(kind) { return GEM_SHOP.find((s) => s.kind === kind) || null; }
function _svEquipSlots() { return ECONOMY.baseEquipSlots + _svP().shop.equipSlots; }
function _svInvSlots() { return ECONOMY.baseInvSlots + _svP().shop.invSlots * ECONOMY.invSlotsPerPurchase; }
function _svHighestOrder() {
  const p = _svP();
  let o = 0;
  for (const id of p.worlds.unlocked) { const w = WORLD_BY_ID[id]; if (w && w.order > o) o = w.order; }
  return o;
}
function _svMultOfPet(pet) {
  const a = ANIMAL_BY_ID[pet.id], v = VARIANTS[pet.variant];
  return (a ? a.mult : 1) * (v ? v.mult : 1);
}
function _svEmitEquip() { Bus.emit('equip:changed', { equipped: _svP().equipped.slice() }); }
function _svPetsChanged() { Bus.emit('pets:changed', {}); }

function _svUsableEquip(eq) {
  const p = _svP();
  return !!eq && p.worlds.unlocked.includes(eq.world) && p.strength >= eq.requires;
}
/** Returns the selected equipment if usable, else switches to the best usable one. */
function _svResolveEquip() {
  const p = _svP();
  let eq = EQUIPMENT_BY_ID[p.training.selected];
  if (_svUsableEquip(eq)) return eq;
  let best = null;
  for (const e of TRAINING_EQUIPMENT) if (_svUsableEquip(e) && (!best || e.power > best.power)) best = e;
  if (best) p.training.selected = best.id;
  return best;
}

function _svPickAnimal(worldId, rarityId, lowOnly) {
  const inWorld = ANIMALS.filter((a) => a.world === worldId);
  let list = inWorld.filter((a) => a.rarity === rarityId);
  if (!list.length || (lowOnly && _svRarityOrder(rarityId) > 1)) list = inWorld.filter((a) => a.rarity === 'common');
  if (!list.length) list = inWorld;
  return list.length ? pick(list) : null;
}

function _svRollVariant(special) {
  const vc = FORMULAS.variantChances(special);
  if (Math.random() < vc.rainbow) return 'rainbow';
  if (Math.random() < vc.golden) return 'golden';
  return 'normal';
}

/* ---------- Remote ---------- */
const Remote = {
  handlers: {},
  invoke(name, args = {}) {
    const h = Remote.handlers[name];
    if (typeof name !== 'string' || typeof h !== 'function' || !Object.prototype.hasOwnProperty.call(Remote.handlers, name)) return { ok: false, err: 'Unknown action' };
    if (!isObj(args)) return { ok: false, err: 'Bad request' };
    if (!Game.player) return { ok: false, err: 'No player data' };
    try {
      const r = h(args);
      return r && typeof r === 'object' ? r : { ok: true };
    } catch (e) {
      console.error('[Remote]', name, e);
      return { ok: false, err: 'Something went wrong' };
    }
  },
};
const _svH = Remote.handlers;

/* ---------- claw ---------- */
_svH['claw:start'] = () => {
  const p = _svP();
  const w = _svWorld();
  if (!w) return _svFail('Unknown world');
  const cost = w.playCost || 0;
  if (p.coins < cost) return _svFail('Not enough coins');
  p.coins -= cost;
  p.stats.plays++;
  _svMachine(w.id).plays++;
  const playId = uid('play');
  _svPlays[playId] = { worldId: w.id, started: Date.now() };
  const keys = Object.keys(_svPlays);
  if (keys.length > 24) for (const k of keys.slice(0, keys.length - 24)) delete _svPlays[k];
  _svCurrency();
  return { ok: true, playId, cost };
};

_svH['claw:grip'] = (a) => {
  const p = _svP();
  const w = _svWorld();
  const entry = _svMachine(w.id).pit.find((e) => e.pid === a.pid);
  if (!entry) return _svFail('That animal is gone');
  const alignment = clamp(isNum(a.alignment) ? a.alignment : 0, 0, 1);
  const st = Services.stats();
  const weight = FORMULAS.animalWeight(entry.id, entry.variant);
  const ch = FORMULAS.gripChance({ power: st.gripPower, weight, alignment });
  const success = Math.random() < ch;
  let slipAfter;
  if (success) {
    const rate = FORMULAS.slipRate({ protection: st.protection, weight });
    if (!(rate > 0)) slipAfter = null;
    else {
      const t = -Math.log(1 - Math.random()) / rate;
      slipAfter = t > ECONOMY.carryTime ? null : Math.max(0.35, t);
    }
  } else slipAfter = randRange(0.15, 0.8);
  return { ok: true, success, chance: ch, slipAfter };
};

_svH['claw:prize'] = (a) => {
  const p = _svP();
  const w = _svWorld();
  const m = _svMachine(w.id);
  const idx = m.pit.findIndex((e) => e.pid === a.pid);
  if (idx < 0) return _svFail('That animal is gone');
  const entry = m.pit.splice(idx, 1)[0];
  Bus.emit('pit:remove', { worldId: w.id, pid: entry.pid });
  const animal = ANIMAL_BY_ID[entry.id];
  const st = Services.stats();
  const pet = { uid: uid('p'), id: entry.id, variant: entry.variant, locked: false, t: Date.now() };
  let soldForCoins = 0, added = false;
  if (p.pets.length >= st.invSlots) {
    soldForCoins = Math.max(0, Math.floor(FORMULAS.sellValue(entry.id, entry.variant)));
    p.coins += soldForCoins;
    _svToast('Inventory full! Sold ' + animal.name + ' for ' + fmt(soldForCoins) + ' coins', 'bad');
  } else { p.pets.push(pet); added = true; }
  const coins = FORMULAS.catchCoins({ animalId: entry.id, variant: entry.variant, coinMult: st.coinMult });
  let gems = 0;
  if (Math.random() < FORMULAS.catchGemChance({ animalId: entry.id, variant: entry.variant, gemFinder: st.gemFinder })) gems = FORMULAS.catchGems(entry.id);
  p.coins += coins;
  p.gems += gems;
  const prev = p.discovered[entry.id] || 0;
  p.discovered[entry.id] = prev + 1;
  const isNew = prev === 0;
  let discoverGems = 0;
  if (isNew) { discoverGems = RARITY_BY_ID[animal.rarity].discoverGems || 0; p.gems += discoverGems; }
  p.stats.wins++;
  p.stats.coinsEarned += coins + soldForCoins;
  if (!p.stats.bestRarity || _svRarityOrder(animal.rarity) > _svRarityOrder(p.stats.bestRarity)) p.stats.bestRarity = animal.rarity;
  if (added) Bus.emit('pet:added', { pet, animal, isNew });
  _svPetsChanged();
  _svReward(coins + soldForCoins, gems, 0, 'catch');
  if (discoverGems > 0) _svReward(0, discoverGems, 0, 'discover');
  _svCurrency();
  if (RARITY_BY_ID[animal.rarity].reveal || entry.variant !== 'normal' || isNew) Bus.emit('reveal', { pet, animal, isNew });
  _svSave('prize');
  Services.ensurePit(w.id);
  return { ok: true, pet, animal, coins, gems: gems + discoverGems, isNew, soldForCoins };
};

_svH['claw:end'] = (a) => {
  const p = _svP();
  if (!isStr(a.playId) || !_svPlays[a.playId]) return _svFail('Unknown play');
  if (!['miss', 'slip', 'empty', 'win'].includes(a.result)) return _svFail('Bad result');
  if (a.result === 'miss') p.stats.misses++;
  else if (a.result === 'slip') p.stats.slips++;
  delete _svPlays[a.playId];
  return { ok: true };
};

/* ---------- upgrades ---------- */
_svH['upgrade:buy'] = (a) => {
  const p = _svP();
  const up = UPGRADE_BY_ID[a.id];
  if (!up) return _svFail('Unknown upgrade');
  if (!p.worlds.unlocked.includes(up.world)) { const w = WORLD_BY_ID[up.world]; return _svFail('Unlock ' + (w ? w.name : 'the world') + ' first'); }
  const level = p.upgrades[up.id] || 0;
  if (level >= up.maxLevel) return _svFail('Max level');
  if (level >= FORMULAS.upgradeCap(up.id, p.worlds.unlocked.length)) return _svFail('Unlock the next world to upgrade further');
  const cost = FORMULAS.upgradeCost(up.id, level);
  const cur = up.currency === 'gems' ? 'gems' : 'coins';
  if (p[cur] < cost) return _svFail('Not enough ' + cur);
  p[cur] -= cost;
  p.upgrades[up.id] = level + 1;
  Bus.emit('upgrade:bought', { id: up.id, level: level + 1 });
  _svCurrency();
  _svSave('upgrade');
  if (up.id === 'capacity') Services.ensurePit(p.worlds.current);
  return { ok: true, level: level + 1, cost };
};

/* ---------- pets ---------- */
_svH['pet:equip'] = (a) => {
  const p = _svP();
  const pet = _svPet(a.uid);
  if (!pet) return _svFail('Pet not found');
  if (p.equipped.includes(pet.uid)) return _svFail('Already equipped');
  if (p.equipped.length >= _svEquipSlots()) return _svFail('All pet slots are full');
  p.equipped.push(pet.uid);
  _svEmitEquip(); _svPetsChanged(); _svSave('equip');
  return { ok: true };
};
_svH['pet:unequip'] = (a) => {
  const p = _svP();
  const i = p.equipped.indexOf(a.uid);
  if (i < 0) return _svFail('Not equipped');
  p.equipped.splice(i, 1);
  _svEmitEquip(); _svPetsChanged(); _svSave('equip');
  return { ok: true };
};
_svH['pet:equipBest'] = () => {
  const p = _svP();
  p.equipped = Services.petsSorted('mult').slice(0, _svEquipSlots()).map((x) => x.uid);
  _svEmitEquip(); _svPetsChanged(); _svSave('equip');
  return { ok: true };
};
_svH['pet:unequipAll'] = () => {
  const p = _svP();
  p.equipped = [];
  _svEmitEquip(); _svPetsChanged(); _svSave('equip');
  return { ok: true };
};
_svH['pet:lock'] = (a) => {
  const pet = _svPet(a.uid);
  if (!pet) return _svFail('Pet not found');
  pet.locked = !!a.locked;
  _svPetsChanged(); _svSave('lock');
  return { ok: true };
};
_svH['pet:sell'] = (a) => {
  const p = _svP();
  const pet = _svPet(a.uid);
  if (!pet) return _svFail('Pet not found');
  if (pet.locked) return _svFail('Unlock this pet first');
  if (p.equipped.includes(pet.uid)) return _svFail('Unequip this pet first');
  const coins = Math.max(0, Math.floor(FORMULAS.sellValue(pet.id, pet.variant)));
  p.pets.splice(p.pets.indexOf(pet), 1);
  p.coins += coins;
  _svPetsChanged(); _svReward(coins, 0, 0, 'sell'); _svCurrency(); _svSave('sell');
  return { ok: true, coins };
};
_svH['pet:sellBulk'] = (a) => {
  const p = _svP();
  if (!RARITY_BY_ID[a.rarity]) return _svFail('Unknown rarity');
  let coins = 0, count = 0;
  const keep = [];
  for (const pet of p.pets) {
    const an = ANIMAL_BY_ID[pet.id];
    if (an && an.rarity === a.rarity && !pet.locked && !p.equipped.includes(pet.uid)) {
      coins += Math.max(0, Math.floor(FORMULAS.sellValue(pet.id, pet.variant)));
      count++;
    } else keep.push(pet);
  }
  if (!count) return _svFail('Nothing to sell');
  p.pets = keep;
  p.coins += coins;
  _svPetsChanged(); _svReward(coins, 0, 0, 'sell'); _svCurrency(); _svSave('sell');
  return { ok: true, coins, count };
};
_svH['pet:evolve'] = (a) => {
  const p = _svP();
  const pet = _svPet(a.uid);
  if (!pet) return _svFail('Pet not found');
  const info = Services.evolveInfo(a.uid);
  if (!info.next) return _svFail('Already max evolution');
  if (pet.locked) return _svFail('Unlock this pet first');
  if (!info.can) return _svFail('Need ' + info.need + ' of the same pet (have ' + info.have + ')');
  const same = p.pets.filter((x) => x !== pet && x.id === pet.id && x.variant === pet.variant && !x.locked);
  same.sort((x, y) => (p.equipped.includes(x.uid) ? 1 : 0) - (p.equipped.includes(y.uid) ? 1 : 0));
  const used = [pet].concat(same.slice(0, info.need - 1));
  const ids = new Set(used.map((x) => x.uid));
  p.pets = p.pets.filter((x) => !ids.has(x.uid));
  const oldEq = p.equipped.length;
  p.equipped = p.equipped.filter((u) => !ids.has(u));
  const np = { uid: uid('p'), id: pet.id, variant: info.next, locked: false, t: Date.now() };
  p.pets.push(np);
  const animal = ANIMAL_BY_ID[np.id];
  Bus.emit('pet:added', { pet: np, animal, isNew: false });
  Bus.emit('reveal', { pet: np, animal, isNew: false });
  _svPetsChanged();
  if (p.equipped.length !== oldEq) _svEmitEquip();
  _svSave('evolve');
  return { ok: true, pet: np };
};

/* ---------- training ---------- */
_svH['train:select'] = (a) => {
  const p = _svP();
  const eq = EQUIPMENT_BY_ID[a.id];
  if (!eq) return _svFail('Unknown equipment');
  if (!p.worlds.unlocked.includes(eq.world)) return _svFail('Unlock ' + (WORLD_BY_ID[eq.world] ? WORLD_BY_ID[eq.world].name : 'the world') + ' first');
  if (p.strength < eq.requires) return _svFail('Need ' + fmt(eq.requires) + ' strength');
  p.training.selected = eq.id;
  _svSave('train-select');
  return { ok: true };
};
function _svRep(auto) {
  const p = _svP();
  const eq = _svResolveEquip();
  if (!eq) return _svFail('No usable equipment');
  const gain0 = FORMULAS.trainGain({ equipmentId: eq.id, trainMult: Services.stats().trainMult });
  const gain = auto ? gain0 * ECONOMY.autoTrainFactor : gain0;
  p.strength += gain;
  p.stats.reps++;
  Bus.emit('train:rep', { gain, auto: !!auto });
  _svReward(0, 0, gain, 'train');
  _svCurrency();
  return { ok: true, gain };
}
_svH['train:rep'] = (a) => {
  const auto = !!a.auto;
  if (!auto) {
    const now = _svNow();
    if (now - _svLastRep < ECONOMY.repCooldown * 1000) return { ok: false, err: '' };
    _svLastRep = now;
  }
  return _svRep(auto);
};
_svH['train:auto'] = (a) => {
  const p = _svP();
  if (!p.shop.autoTrain) return _svFail('Buy Auto Train in the shop first');
  p.training.auto = !!a.on;
  _svSave('train-auto');
  return { ok: true };
};

/* ---------- worlds ---------- */
_svH['world:unlock'] = (a) => {
  const p = _svP();
  const w = WORLD_BY_ID[a.id];
  if (!w) return _svFail('Unknown world');
  if (p.worlds.unlocked.includes(w.id)) return _svFail('Already unlocked');
  const c = Services.canUnlockWorld(w.id);
  if (!c.prevUnlocked) return _svFail('Unlock the previous world first');
  if (p.strength < c.needStrength) return _svFail('Need ' + fmt(c.needStrength) + ' strength');
  if (p.coins < c.needCoins) return _svFail('Not enough coins');
  p.coins -= c.needCoins;
  p.worlds.unlocked.push(w.id);
  _svMachine(w.id);
  Bus.emit('world:unlocked', { id: w.id });
  _svToast('Unlocked ' + w.name + '!', 'good');
  _svCurrency(); _svSave('world-unlock');
  return { ok: true };
};
_svH['world:travel'] = (a) => {
  const p = _svP();
  const w = WORLD_BY_ID[a.id];
  if (!w) return _svFail('Unknown world');
  if (!p.worlds.unlocked.includes(w.id)) return _svFail('World is locked');
  p.worlds.current = w.id;
  _svMachine(w.id);
  _svResolveEquip();
  Bus.emit('world:changed', { id: w.id });
  _svSave('world-travel');
  return { ok: true };
};

/* ---------- shop ---------- */
_svH['shop:buy'] = (a) => {
  const p = _svP();
  const item = GEM_SHOP.find((s) => s.id === a.id);
  if (!item) return _svFail('Unknown item');
  const now = Date.now();
  let n = 0, max = Infinity;
  if (item.kind === 'equipSlot') { n = p.shop.equipSlots; max = Math.min(isNum(item.max) ? item.max : Infinity, ECONOMY.maxEquipSlots - ECONOMY.baseEquipSlots); }
  else if (item.kind === 'invSlots') { n = p.shop.invSlots; if (isNum(item.max)) max = item.max; }
  else if (item.kind === 'autoTrain') { n = p.shop.autoTrain ? 1 : 0; max = 1; }
  else if (item.kind !== 'boostLuck' && item.kind !== 'boostCoins') return _svFail('Unknown item');
  if (n >= max) return _svFail('Sold out');
  const cost = Array.isArray(item.cost) ? item.cost[Math.min(n, item.cost.length - 1)] : item.cost;
  if (!isNum(cost)) return _svFail('Unavailable');
  if (p.gems < cost) return _svFail('Not enough gems');
  p.gems -= cost;
  if (item.kind === 'equipSlot') p.shop.equipSlots++;
  else if (item.kind === 'invSlots') p.shop.invSlots++;
  else if (item.kind === 'autoTrain') p.shop.autoTrain = true;
  else {
    const key = item.kind === 'boostLuck' ? 'luck' : 'coins';
    p.boosts[key] = Math.max(now, p.boosts[key] || 0) + (item.duration || 0) * 1000;
    _svBoostLive[key] = true;
  }
  Bus.emit('shop:bought', { id: item.id });
  _svCurrency();
  if (item.kind === 'equipSlot' || item.kind === 'invSlots') _svPetsChanged();
  _svSave('shop');
  return { ok: true };
};

/* ---------- rewards ---------- */
_svH['index:claim'] = (a) => {
  const p = _svP();
  const w = WORLD_BY_ID[a.worldId];
  if (!w) return _svFail('Unknown world');
  if (p.indexClaimed[w.id]) return _svFail('Already claimed');
  const all = ANIMALS.filter((x) => x.world === w.id);
  if (!all.length || !all.every((x) => (p.discovered[x.id] || 0) > 0)) return _svFail('Discover every animal first');
  p.indexClaimed[w.id] = true;
  const gems = w.indexReward || 0;
  p.gems += gems;
  Bus.emit('index:claimed', { worldId: w.id, gems });
  _svReward(0, gems, 0, 'index');
  _svCurrency(); _svSave('index');
  return { ok: true, gems };
};
_svH['daily:claim'] = () => {
  const p = _svP();
  const d = Services.dailyInfo();
  if (!d.ready) return _svFail('Come back in ' + fmtDur(d.secondsLeft));
  p.daily.streak = d.streak;
  p.daily.last = Date.now();
  p.gems += d.gems;
  p.coins += d.coins;
  Bus.emit('daily:claimed', { gems: d.gems, coins: d.coins });
  _svReward(d.coins, d.gems, 0, 'daily');
  _svCurrency(); _svSave('daily');
  return { ok: true, gems: d.gems, coins: d.coins };
};
_svH['settings:set'] = (a) => {
  const p = _svP();
  let v = a.value;
  if (a.key === 'quality') { if (!['auto', 'low', 'medium', 'high'].includes(v)) return _svFail('Bad value'); }
  else if (a.key === 'sound' || a.key === 'music') { if (typeof v !== 'boolean') return _svFail('Bad value'); }
  else if (a.key === 'volume') { if (!isNum(v)) return _svFail('Bad value'); v = clamp(v, 0, 1); }
  else return _svFail('Unknown setting');
  p.settings[a.key] = v;
  Bus.emit('settings:changed', { key: a.key, value: v });
  _svSave('settings');
  return { ok: true };
};

/* ---------- Services ---------- */
const Services = {
  stats() {
    const p = _svP();
    const F = FORMULAS;
    const lv = (id) => p.upgrades[id] || 0;
    const uv = (id) => F.upgradeValue(id, lv(id));
    const now = Date.now();
    const w = _svWorld() || WORLDS[0];
    const eqPets = [];
    for (const u of p.equipped) { const pet = _svPet(u); if (pet) eqPets.push(_svMultOfPet(pet)); }
    const petMult = F.petMultiplier(eqPets);
    const lb = _svBoostItem('boostLuck'), cb = _svBoostItem('boostCoins');
    const luckBoost = p.boosts.luck > now && lb ? (lb.mult || 1) : 1;
    const coinBoost = p.boosts.coins > now && cb ? (cb.mult || 1) : 1;
    return {
      gripPower: uv('strength') + F.strengthGripBonus(p.strength),
      protection: uv('protection'),
      clawSpeed: uv('speed'),
      capacity: Math.min(uv('capacity'), ECONOMY.pitMax),
      luck: uv('luck') * luckBoost,

};

      S.ico(0, 0, 0, 0.3, '#3a2d33', { detail: 0 });
      S.ico(0, 0, 0, 0.21, col, { detail: 0, e: true });
      for (const [px, py, pz] of [[0.22, 0.14, 0.12], [-0.2, 0.1, 0.2], [0.05, -0.22, 0.2], [-0.14, 0.22, -0.14], [0.12, -0.05, -0.27]])
        S.ico(px, py, pz, 0.09, _scShade(col, 1.25), { detail: 0, e: true });
      break;
    default:
      S.sph(0, 0, 0, 0.25, col);

}

/* ---------- room shell: floor, walls, lip ---------- */
function _scFloor(S, th, R) {
  const A = new THREE.Color(th.floorA), Bc = new THREE.Color(th.floorB), kind = th.decor;
  const hx = ROOM.halfX, hz = ROOM.halfZ;
  S.setBase(0, 0, 0, 0);
  const jit = (c, a) => _scShade(c, 1 + (R() - 0.5) * a);
  if (kind === 'jungle') {
    S.quad(0, 0, 0, hx * 2, hz * 2, _scShade(A, 0.45));
    for (let i = 0; i < hx * 2 / 0.6; i++) {
      let z = -hz;
      const x = -hx + 0.3 + i * 0.6;
      while (z < hz - 0.05) {
        const len = Math.min(hz - z, 2 + R() * 3);
        S.quad(x, 0.004, z + len / 2, 0.54, len - 0.05, jit(_scMix(A, Bc, R()), 0.12));
        z += len;
      }
    }
  } else if (kind === 'space') {
    S.quad(0, 0, 0, hx * 2, hz * 2, _scShade(A, 0.55));
    for (let ix = 0; ix < hx; ix++) for (let iz = 0; iz < hz; iz++)
      S.quad(-hx + 1 + ix * 2, 0.004, -hz + 1 + iz * 2, 1.9, 1.9, jit((ix + iz) % 2 ? A : Bc, 0.1));
    const gl = _scShade(th.neon, 0.5);
    for (let x = -hx; x <= hx; x += 2) S.box(x, 0.012, 0, 0.06, 0.012, hz * 2, gl, { e: true });
    for (let z = -hz; z <= hz; z += 2) S.box(0, 0.012, z, hx * 2, 0.012, 0.06, gl, { e: true });
  } else if (kind === 'frozen') {
    S.quad(0, 0, 0, hx * 2, hz * 2, _scShade(Bc, 0.8));
    for (let ix = 0; ix < hx; ix++) for (let iz = 0; iz < hz; iz++) {
      let c = jit((ix + iz) % 2 ? A : Bc, 0.1);
      if (R() < 0.08) c = _scShade(c, 1.18);
      S.quad(-hx + 1 + ix * 2, 0.004, -hz + 1 + iz * 2, 1.92, 1.92, c);
    }
  } else if (kind === 'desert') {
    S.quad(0, 0, 0, hx * 2, hz * 2, _scShade(A, 0.7));
    for (let ix = 0; ix < hx / 0.75; ix++) for (let iz = 0; iz < hz / 0.75; iz++)
      S.quad(-hx + 0.75 + ix * 1.5, 0.004, -hz + 0.75 + iz * 1.5, 1.44, 1.44, jit(_scMix(A, Bc, (ix + iz) % 2 ? 0.8 : R() * 0.4), 0.1));
  } else {
    for (let ix = 0; ix < hx * 2; ix++) for (let iz = 0; iz < hz * 2; iz++)
      S.quad(-hx + 0.5 + ix, 0, -hz + 0.5 + iz, 1, 1, jit((ix + iz) % 2 ? A : Bc, 0.05));
  }
}

function _scWalls(S, th, R) {
  const H = ROOM.height, wall = new THREE.Color(th.wall), trim = new THREE.Color(th.wallTrim);
  const decor = th.decor;
  for (const [side, L] of [['back', ROOM.halfX * 2 + 0.8], ['left', ROOM.halfZ * 2], ['right', ROOM.halfZ * 2]]) {
    S.wall(side, 0);
    S.box(0, H / 2, -0.2, L, H, 0.4, wall);
    const panels = Math.round(L / 2.2);
    const pw = L / panels;
    for (let i = 0; i < panels; i++) {
      const px = -L / 2 + pw * (i + 0.5);
      S.box(px, 3.8, 0.02, pw - 0.12, H - 2.6, 0.05, _scShade(wall, i % 2 ? 0.93 : 1.07));
    }
    if (decor === 'jungle') {
      for (let i = 0; i < L / 0.5; i++) S.box(-L / 2 + 0.25 + i * 0.5, 0.75, 0.06, 0.46, 1.5, 0.1, _scShade(trim, 0.85 + R() * 0.3));
    } else {
      S.box(0, 0.7, 0.06, L, 1.4, 0.12, trim);
    }
    S.box(0, 1.46, 0.1, L, 0.12, 0.2, _scShade(trim, 1.25));
    S.box(0, 0.09, 0.12, L, 0.18, 0.24, _scShade(trim, 0.6));
    S.box(0, H - 0.12, 0.1, L, 0.24, 0.3, _scShade(trim, 0.8));
    for (let px = -L / 2 + 0.2; px <= L / 2; px += 5.5) S.box(px, H / 2, 0.1, 0.3, H, 0.22, _scShade(trim, 0.9));
    S.box(0, 5.15, 0.05, L - 0.8, 0.1, 0.06, th.neon, { e: true });
    S.box(0, 1.6, 0.1, L - 0.8, 0.045, 0.04, th.accent, { e: true });
    if (decor === 'space') {
      for (let px = -L / 2 + 2.2; px < L / 2; px += 2.2) S.box(px, 3.8, 0.06, 0.04, H - 2.6, 0.02, '#0b1020');
      if (Scene3D.preset.decor >= 1) for (let px = -L / 2 + 0.6; px < L / 2; px += 1.1) for (const y of [1.9, 5.5])
        S.cyl(px, y, 0.07, 0.05, 0.05, 0.04, '#d9e2f5', { rx: Math.PI / 2, seg: 6 });
    }
    if (decor === 'desert') {
      for (let y = 1.9; y < 5; y += 0.55) S.box(0, y, 0.05, L, 0.04, 0.03, _scShade(wall, 0.78));
    }
    if (decor === 'frozen') {
      for (let px = -L / 2 + 0.5; px < L / 2; px += 1.3 + R()) S.sph(px, H - 0.05, 0.22, 0.4 + R() * 0.45, '#ffffff', { sy: 0.45, seg: 8, segH: 5 });
    }
  }
  // low decorative lip along the open front edge
  S.setBase(0, 0, 0, 0);
  const fz = ROOM.halfZ + 0.15;
  S.box(0, 0.16, fz, ROOM.halfX * 2 + 0.8, 0.32, 0.5, trim);
  S.box(0, 0.34, fz, ROOM.halfX * 2 + 0.8, 0.05, 0.54, _scShade(trim, 1.3));
  S.box(0, 0.37, fz - 0.05, ROOM.halfX * 2, 0.04, 0.08, th.neon, { e: true });
  for (let x = -ROOM.halfX + 1; x <= ROOM.halfX - 0.5; x += 4.4) {
    S.cyl(x, 0.5, fz, 0.2, 0.24, 0.5, _scShade(trim, 0.85));
    S.sph(x, 0.86, fz, 0.2, th.accent, { e: true, seg: 10 });
  }
}

function _scNextWorld() {
  const un = (Game.player && Game.player.worlds && Game.player.worlds.unlocked) || ['starter'];
  if (typeof WORLDS === 'undefined') return null;
  const sorted = WORLDS.slice().sort((a, b) => a.order - b.order);
  for (const w of sorted) if (!un.includes(w.id)) return w;
  return null;
}

  S.box(0, 0.1, 0, 4.2, 0.2, 1.5, _scShade(th.wallTrim, 0.8));

  S.box(0, 4.0, 0, 4.4, 0.3, 0.55, _scShade(th.wallTrim, 0.7));

  const uni = { uT: { value: 0 }, uCol: { value: new THREE.Color(nxt ? nxt.theme.neon : th.neon) } };
  const mat = new THREE.ShaderMaterial({
    uniforms: uni, side: THREE.DoubleSide,

    fragmentShader: `varying vec2 vUv; uniform float uT; uniform vec3 uCol;

        _sc.pets[i] = null;
      }
      _sc.qMarks[i].visible = !p;
      if (!p) continue;
      let inner;
      try { inner = AnimalFactory.build(p.id, p.variant || 'normal'); } catch (e) { console.error('[Scene3D] pet build', e); continue; }
      const holder = new THREE.Group();
      holder.add(inner);
      holder.scale.setScalar(1.6);
      const sp = _sc.petSpots[i];
      holder.position.set(sp.x, sp.y, sp.z);
      holder.rotation.y = st.rotY;
      if (Scene3D.preset.shadows) holder.traverse((o) => { if (o.isMesh) o.castShadow = true; });

    }
  },

  buildEquipmentModel(model, color) {
    const S = new _scSet();
    S.setBase(0, 0, 0, 0);
    _scEquipInto(S, model, color);
    const g = S.toGroup(true);

  },
  disposeEquipmentModel(g) { g.traverse((o) => { if (o.geometry) o.geometry.dispose(); }); },

  toScreen(v3) {
    const cam = Scene3D.camera, v = _sc.v.a;
    cam.updateMatrixWorld();
    v.copy(v3).applyMatrix4(cam.matrixWorldInverse);
    const behind = v.z >= 0;
    v.applyMatrix4(cam.projectionMatrix);
    const w = _sc.size.w, h = _sc.size.h;
    const x = (v.x * 0.5 + 0.5) * w, y = (-v.y * 0.5 + 0.5) * h;
    return { x, y, visible: !behind && Math.abs(v.x) <= 1.05 && Math.abs(v.y) <= 1.05 };
  },

  update(dt) {
    dt = Math.min(dt, 0.25);
    const t = (_sc.time += dt), r = _sc.room;
    // watchdog (auto quality)
    if (_sc.setting === 'auto') {
      const w = _sc.watch;
      w.t += dt; w.n++; w.sum += dt;
      if (w.t >= 4) {
        const avg = (w.sum / w.n) * 1000;
        if (avg > 30 && _sc.time - w.last >= 8 && Scene3D.quality !== 'low') {
          w.last = _sc.time;
          _scApplyQuality(Scene3D.quality === 'high' ? 'medium' : 'low');
          Bus.emit('toast', { text: 'Graphics lowered for smoother play', kind: 'info' });
        }
        w.t = 0; w.n = 0; w.sum = 0;
      }
    }
    if (!r) return;
    _sc.mats.emi.color.setScalar(0.92 + 0.08 * Math.sin(t * 3));
    for (const sp of _sc.labels) sp.position.y = sp.userData.y0 + Math.sin(t * 1.6 + sp.userData.ph) * 0.09;
    if (_sc.portal) {
      _sc.portal.uni.uT.value = t;
      if (!_sc.portal.nxt) { const c = new THREE.Color().setHSL((t * 0.12) % 1, 0.9, 0.6); _sc.portal.uni.uCol.value.copy(c); _sc.portal.ringMat.color.copy(c); }
    }
    if (r.anim) r.anim.uni.uT.value = t;
    if (_sc.kioskMat) _sc.kioskMat.color.setScalar(0.88 + 0.12 * Math.sin(t * 2.2));
    for (const P of r.particles) {
      const pos = P.pos, n = pos.length / 3, o = P.o;
      if (P.mode === 'stars') { P.pts.material.opacity = 0.75 + 0.25 * Math.sin(t * 1.3); continue; }
      for (let i = 0; i < n; i++) {
        const s0 = P.seed[i * 3], s1 = P.seed[i * 3 + 1], s2 = P.seed[i * 3 + 2], k = i * 3;
        if (P.mode === 'fall') {
          pos[k + 1] -= (o.speed || 0.5) * s1 * dt;
          pos[k] += Math.sin(t * s1 + s0) * (o.sway || 0.2) * dt;
          if (pos[k + 1] < 0) { pos[k + 1] = o.y1; pos[k] = randRange(-ROOM.halfX, ROOM.halfX); pos[k + 2] = randRange(-ROOM.halfZ, ROOM.halfZ); }
        } else {
          pos[k] += Math.cos(t * 0.5 * s1 + s0) * 0.35 * dt + (o.drift ? 0.25 * dt : 0);
          pos[k + 1] += Math.sin(t * 0.7 * s1 + s0 * 2) * 0.25 * dt;
          pos[k + 2] += Math.sin(t * 0.4 * s1 + s0 * 3) * 0.3 * dt;
          if (pos[k] > ROOM.halfX) pos[k] = -ROOM.halfX;
          pos[k + 1] = clamp(pos[k + 1], o.y0, o.y1);
        }
      }
      P.pts.geometry.attributes.position.needsUpdate = true;
    }
    for (const p of _sc.pets) if (p) { try { AnimalFactory.animate(p.inner, t, 'idle', dt); } catch (e) { /* ignore */ } }
  },

  render() {
    if (_sc.ready) Scene3D.renderer.render(Scene3D.scene, Scene3D.camera);
  },
};

/* ==== 05_animals.js ==== */
/* =====================================================================
   05_animals.js — procedural chibi plush animals (AnimalFactory) and the
   spinning pet viewer (PetViewer). See ARCHITECTURE.md sections 4 + 6.
   Everything is created lazily; nothing runs at load time.
   Design space: unit coordinates, total height ~1, front = +Z, origin at the
   bottom centre. Geometry is baked at scale (2 * radius) and cached per animal.
   ===================================================================== */

/* ---------- lazy shared state ---------- */
const _anS = { ready: false };      // temporaries + shared objects
const _anGeoCache = {};             // animalId -> { body, head, extra, meta }
const _anUnit = {};                 // unit primitive geometries
const _anMats = {};                 // shared body materials
const _anFxMats = {};               // shared fx materials
const _anFxGeos = {};               // shared fx geometries
const _anTex = {};                  // shared canvas textures
const _anThumbs = {};               // 'id:variant' -> dataURL

function _anInit() {

  _anS.nm = new THREE.Matrix3();
  _anS.q = new THREE.Quaternion();
  _anS.q2 = new THREE.Quaternion();
  _anS.qi = new THREE.Quaternion();
  _anS.e = new THREE.Euler();
  _anS.p = new THREE.Vector3();
  _anS.s = new THREE.Vector3();
  _anS.v = new THREE.Vector3();
  _anS.n = new THREE.Vector3();
  _anS.up = new THREE.Vector3(0, 1, 0);
  _anS.fwd = new THREE.Vector3(0, 0, 1);
  _anS.zax = new THREE.Vector3(0, 0, 1);
  _anS.v2 = new THREE.Vector2();

}

function _anRng(str) {
  let hsh = 2166136261;
  for (let i = 0; i < str.length; i++) hsh = Math.imul(hsh ^ str.charCodeAt(i), 16777619);
  return function () {
    hsh += 0x6D2B79F5;

    t ^= t + Math.imul(t ^ (t >>> 7), 61 | t);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function _anCol(hex, fb) {
  const T = _anInit();
  const key = typeof hex === 'string' ? hex : (fb || '#cccccc');
  let c = T.colCache[key];
  if (!c) {
    c = new THREE.Color();
    try { c.set(key); } catch (e) { c.set(fb || '#cccccc'); }
    T.colCache[key] = c;
  }

}
function _anMix(a, b, t) { return a.clone().lerp(b, t); }
function _anLum(c) { return 0.299 * c.r + 0.587 * c.g + 0.114 * c.b; }

const _anBlack = () => _anCol('#000000');
const _anDark = () => _anCol('#2a2631');

function _anUnitGeo(kind) {
  let g = _anUnit[kind];
  if (g) return g;
  switch (kind) {
    case 'sph': g = new THREE.SphereGeometry(1, 12, 9); break;
    case 'sph8': g = new THREE.SphereGeometry(1, 8, 6); break;
    case 'cone': g = new THREE.ConeGeometry(1, 1, 9, 1); break;
    case 'cyl': g = new THREE.CylinderGeometry(1, 1, 1, 10, 1); break;
    case 'oct': g = new THREE.OctahedronGeometry(1, 0); break;
    default: g = new THREE.SphereGeometry(1, 10, 8);
  }
  _anUnit[kind] = g;
  return g;
}

/* ---------- geometry builder / merger ---------- */
function _anBuilder() { return { pos: [], nor: [], col: [], tint: [], idx: [], n: 0 }; }

function _anPush(b, geo, m4, col, tint) {
  const T = _anInit();
  const pa = geo.attributes.position, na = geo.attributes.normal, ix = geo.index;
  T.nm.getNormalMatrix(m4);
  const v = T.v, base = b.n;
  for (let i = 0; i < pa.count; i++) {
    v.fromBufferAttribute(pa, i).applyMatrix4(m4);
    b.pos.push(v.x, v.y, v.z);
    v.fromBufferAttribute(na, i).applyMatrix3(T.nm).normalize();
    b.nor.push(v.x, v.y, v.z);
    b.col.push(col.r, col.g, col.b);
    b.tint.push(tint);
  }
  if (ix) for (let i = 0; i < ix.count; i++) b.idx.push(base + ix.getX(i));
  else for (let i = 0; i < pa.count; i++) b.idx.push(base + i);
  b.n += pa.count;
}

function _anToGeometry(b) {
  if (!b || b.n === 0) return null;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(b.pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(b.nor, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(b.col, 3));
  g.setAttribute('aTint', new THREE.Float32BufferAttribute(b.tint, 1));
  g.setIndex(b.n > 65535 ? new THREE.Uint32BufferAttribute(b.idx, 1) : new THREE.Uint16BufferAttribute(b.idx, 1));
  g.computeBoundingSphere();
  g.computeBoundingBox();
  return g;
}

/* A "part" writes into one builder, with its own origin (ox,oy,oz) in unit space and scale k. */
function _anPart(b, k, ox, oy, oz) {
  const T = _anInit();
  const P = {
    put(g, x, y, z, sx, sy, sz, q, col, tint) {
      T.p.set((x + ox) * k, (y + oy) * k, (z + oz) * k);
      T.s.set(sx * k, sy * k, sz * k);
      T.m.compose(T.p, q || T.qi, T.s);
      _anPush(b, g, T.m, col, tint === undefined ? 1 : tint);
    },
    eul(rot) { return rot ? T.q.setFromEuler(T.e.set(rot[0], rot[1], rot[2])) : null; },
    ell(x, y, z, rx, ry, rz, col, tint, rot) {
      const big = Math.max(rx, ry, rz) * k > 0.05;
      this.put(_anUnitGeo(big ? 'sph' : 'sph8'), x, y, z, rx, ry, rz, this.eul(rot), col, tint);
    },
    cone(x, y, z, r, h, col, tint, rot) { this.put(_anUnitGeo('cone'), x, y, z, r, h, r, this.eul(rot), col, tint); },
    coneDir(x, y, z, r, h, dx, dy, dz, col, tint) {
      T.n.set(dx, dy, dz).normalize();
      T.q.setFromUnitVectors(T.up, T.n);
      this.put(_anUnitGeo('cone'), x, y, z, r, h, r, T.q, col, tint);
    },
    cyl(x, y, z, r, h, col, tint, rot) { this.put(_anUnitGeo('cyl'), x, y, z, r, h, r, this.eul(rot), col, tint); },
    oct(x, y, z, rx, ry, rz, col, tint, rot) { this.put(_anUnitGeo('oct'), x, y, z, rx, ry, rz, this.eul(rot), col, tint); },
    rod(x1, y1, z1, x2, y2, z2, r, col, tint) {
      const dx = x2 - x1, dy = y2 - y1, dz = z2 - z1;
      const len = Math.sqrt(dx * dx + dy * dy + dz * dz) || 0.001;
      T.n.set(dx / len, dy / len, dz / len);
      T.q.setFromUnitVectors(T.up, T.n);
      this.put(_anUnitGeo('cyl'), (x1 + x2) / 2, (y1 + y2) / 2, (z1 + z2) / 2, r, len, r, T.q, col, tint);
    },
    /** Torus in the local XY plane, radius 1 scaled (sx,sy,sz); optional start angle baked in. */
    torS(x, y, z, tube, arc, start, sx, sy, sz, rot, col, tint) {
      const g = new THREE.TorusGeometry(1, tube, 5, 22, arc);
      if (start) g.rotateZ(start);
      this.put(g, x, y, z, sx, sy, sz, this.eul(rot), col, tint);
      g.dispose();
    },
    /** Primitive laid on an ellipsoid surface (centre c, radii R) in direction d, local +Z = surface normal. */
    surf(geo, c, R, dx, dy, dz, sx, sy, sz, lift, col, tint, roll) {
      const l = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1;
      dx /= l; dy /= l; dz /= l;
      const px = c[0] + R[0] * dx, py = c[1] + R[1] * dy, pz = c[2] + R[2] * dz;
      T.n.set(dx / R[0], dy / R[1], dz / R[2]).normalize();
      T.q.setFromUnitVectors(T.fwd, T.n);
      if (roll) { T.q2.setFromAxisAngle(T.zax, roll); T.q.multiply(T.q2); }
      this.put(geo, px + T.n.x * lift, py + T.n.y * lift, pz + T.n.z * lift, sx, sy, sz, T.q, col, tint);
    },
    disc(c, R, dx, dy, dz, sx, sy, sz, lift, col, tint) {
      this.surf(_anUnitGeo(Math.max(sx, sy) * k > 0.05 ? 'sph' : 'sph8'), c, R, dx, dy, dz, sx, sy, sz, lift, col, tint);
    },
  };
  return P;
}

/* unit direction on the front hemisphere from screen-ish offsets */
function _anFront(dx, dy) { return [dx, dy, Math.sqrt(Math.max(0.02, 1 - dx * dx - dy * dy))]; }
function _anPt(c, R, dx, dy, dz) {
  const l = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1;
  return [c[0] + R[0] * dx / l, c[1] + R[1] * dy / l, c[2] + R[2] * dz / l];
}

/* ---------- layouts ---------- */
const _anTYPES = {
  quad:  { bc: [0, 0.31, -0.05], br: [0.28, 0.23, 0.32], hc: [0, 0.62, 0.1], hr: [0.34, 0.3, 0.3], tail: [0, 0.36, -0.36] },
  biped: { bc: [0, 0.3, 0], br: [0.22, 0.22, 0.2], hc: [0, 0.66, 0.03], hr: [0.33, 0.3, 0.29], tail: [0, 0.2, -0.2] },
  bird:  { bc: [0, 0.3, 0], br: [0.3, 0.28, 0.29], hc: [0, 0.63, 0.05], hr: [0.29, 0.26, 0.26], tail: [0, 0.3, -0.3] },
  round: { bc: [0, 0.29, 0], br: [0.37, 0.3, 0.35], hc: [0, 0.6, 0.03], hr: [0.35, 0.3, 0.32], tail: [0, 0.27, -0.35] },
  snake: { bc: [0, 0.2, 0], br: [0.3, 0.12, 0.3], hc: [0, 0.66, 0.04], hr: [0.3, 0.26, 0.28], tail: [0.3, 0.1, 0.1] },
  fish:  { bc: [0, 0.47, -0.17], br: [0.27, 0.31, 0.42], hc: [0, 0.49, 0.2], hr: [0.31, 0.29, 0.27], tail: [0, 0.47, -0.55] },
  bug:   { bc: [0, 0.29, -0.08], br: [0.31, 0.24, 0.36], hc: [0, 0.57, 0.2], hr: [0.29, 0.25, 0.25], tail: [0, 0.27, -0.42] },
};
const _anTAILTIP = {
  puff: [0, 0.08, -0.05], long: [0, 0.3, -0.22], fluffy: [0, 0.22, -0.17], curl: [0, 0.1, -0.05],
  fin: [0, 0.1, -0.2], stinger: [0, 0.02, -0.26], none: [0, 0.1, 0],
};

function _anFallbackDef() {
  return {
    id: '__fallback', name: 'Plush', rarity: 'common', size: 1, body: 'quad',
    colors: { main: '#b9bac4', accent: '#9a9ba8', belly: '#e4e4ea', eye: '#2a2a35' },
    ears: 'round', tail: 'puff', pattern: 'none', extras: [],
  };
}
function _anDef(id) {
  let a = null;
  try { a = (typeof ANIMAL_BY_ID !== 'undefined' && ANIMAL_BY_ID) ? ANIMAL_BY_ID[id] : null; } catch (e) { a = null; }
  return a || null;
}

  return clamp(0.22 * s, 0.17, 0.30);
}

/* ---------- the big builder ---------- */
function _anBuildGeo(def, key) {
  const rng = _anRng(key);

  const type = _anTYPES[def.body] ? def.body : 'quad';
  const S = _anTYPES[type];
  const colors = def.colors || {};

  const cA = _anCol(colors.accent, '#9a9ba8');
  const cB = _anCol(colors.belly, '#e8e8ee');
  const cE = _anCol(colors.eye, '#24232e');
  const ex = Array.isArray(def.extras) ? def.extras : [];
  const has = (n) => ex.indexOf(n) >= 0;
  const ears = def.ears || 'none', tail = def.tail || 'none', pattern = def.pattern || 'none';
  const dark = _anDark();
  const pink = _anCol('#ff8fa6');
  const noseC = _anCol('#3a2a30');
  const whisk = _anLum(cM) > 0.45 ? _anCol('#4a4552') : _anCol('#ffffff');

  const bc = S.bc, br = S.br, hc = S.hc, hr = S.hr;
  const isBird = type === 'bird', isFish = type === 'fish', isSnake = type === 'snake', isBug = type === 'bug';
  const hasBeak = isBird || has('beak');
  const wingsAny = isBird || has('wings');
  const finsAny = isFish || has('fins');
  const hasFlap = wingsAny || finsAny;
  const flapPivot = [0, bc[1] + 0.06, bc[2]];
  const legType = hasFlap ? null : (type === 'quad' || type === 'biped' || type === 'round' || isBug ? type : null);
  const hipY = 0.2;

  const bB = _anBuilder(), hB = _anBuilder(), xB = _anBuilder();
  const B = _anPart(bB, k, 0, 0, 0);
  const H = _anPart(hB, k, 0, 0, 0);   // head parts use head-local coordinates
  let X = null, xPivot = [0, 0, 0];
  if (hasFlap) { xPivot = flapPivot; X = _anPart(xB, k, -xPivot[0], -xPivot[1], -xPivot[2]); }
  else if (legType) { xPivot = [0, hipY, 0]; X = _anPart(xB, k, 0, -hipY, 0); }
  const L = X && !hasFlap ? X : B;   // where legs go

  /* ===== BODY ===== */
  if (isSnake) {
    const N = 20;
    let last = null;
    for (let i = 0; i < N; i++) {
      const s = i / (N - 1);
      const ang = Math.PI * 0.5 + s * Math.PI * 3;
      const rr = 0.35 - 0.17 * s;
      const x = Math.cos(ang) * rr, z = Math.sin(ang) * rr * 0.95, y = 0.09 + 0.2 * s;
      const sr = 0.075 + 0.075 * Math.pow(s, 0.8);
      const col = i % 2 ? _anMix(cM, cB, 0.28) : cM;
      B.ell(x, y, z, sr, sr * 0.95, sr, col, 1);
      last = [x, y, z, sr];
    }
    for (let i = 1; i <= 4; i++) {
      const s = i / 4;
      const col = i % 2 ? _anMix(cM, cB, 0.28) : cM;
      B.ell(last[0] * (1 - s) * 0.9, last[1] + (0.5 - last[1]) * s, last[2] + (-0.02 - last[2]) * s, 0.145, 0.15, 0.145, col, 1);

      B.ell(bc[0] + bf[0], bc[1] + bf[1], bc[2] + bf[2], br[0] * bf[3], br[1] * bf[4], br[2] * bf[5], cB, 1);

  }

  /* ===== PATTERN ===== */
  if (!isSnake) {

      for (let i = 0; i < n; i++) {
        let dx = rng() * 2 - 1, dy = 0.15 + rng() * 0.85, dz = rng() * 1.5 - 1.1;
        if (isBug) dz = rng() * 1.6 - 0.9;

        B.disc(bc, br, dx, dy, dz, sz, sz, sz * 0.45, 0.0, cA, 1);
      }
      H.disc([0, 0, 0], hr, -0.45, 0.8, 0.35, 0.05, 0.05, 0.02, 0.0, cA, 1);
      H.disc([0, 0, 0], hr, 0.55, 0.65, 0.4, 0.04, 0.04, 0.02, 0.0, cA, 1);
    } else if (pattern === 'stripes') {
      const zs = isFish ? [-0.5, -0.22, 0.05] : [-0.55, -0.15, 0.25];
      for (let i = 0; i < zs.length; i++) {
        const dz = zs[i] * br[2];
        const f = Math.sqrt(Math.max(0.05, 1 - zs[i] * zs[i]));
        B.torS(bc[0], bc[1], bc[2] + dz, 0.11, Math.PI * 1.3, -0.15 * Math.PI, br[0] * f * 1.0, br[1] * f * 1.0, 0.04, null, cA, 1);
      }
      // forehead bars
      H.disc([0, 0, 0], hr, 0, 0.62, 0.7, 0.028, 0.075, 0.02, 0.0, cA, 1);
      H.disc([0, 0, 0], hr, 0.3, 0.6, 0.66, 0.024, 0.06, 0.02, 0.0, cA, 1);
      H.disc([0, 0, 0], hr, -0.3, 0.6, 0.66, 0.024, 0.06, 0.02, 0.0, cA, 1);

      const x = randRange(P.minX + r, P.maxX - r), z = randRange(P.minZ + r, P.maxZ - r);

    return out.set(0.3, 0, -0.3);
  }

  _makeBody(entry) {
    let group;

    let r = 0.22; try { r = AnimalFactory.radiusOf(entry.id) || 0.22; } catch (e) { /* ignore */ }

    if (Scene3D && Scene3D.preset && Scene3D.preset.shadows) group.traverse((o) => { if (o.isMesh) o.castShadow = true; });

      yaw: Math.random() * TAU, yawVel: 0, tiltX: 0, tiltZ: 0, baseTX: randRange(-0.08, 0.08), baseTZ: randRange(-0.08, 0.08),

  _removeBody(b, dispose = true) {

  }

  }

    this.bodies.length = 0; this.spawnQ.length = 0; this.held = null;
    const m = Game.player && Game.player.machines && Game.player.machines[this.worldId];
    const pit = (m && m.pit) || [];
    const base = MACHINE_DIMS.baseHeight;
    let i = 0;
    for (const entry of pit) {
      const b = this._makeBody(entry);
      this._randPitPos(b.r, b.pos);
      b.pos.y = base + b.r + 0.1 + (i % 4) * 0.3 + Math.random() * 0.1;
      b.spawnT = 1; i++;
    }
    const n = this.bodies.length;
    for (let s = 0; s < 300 && n; s++) this._physics(1 / 60);
    for (const b of this.bodies) { this._syncXform(b); b.sleeping = b.sleeping || false; }
  }

  _queueSpawn(entry) {

    for (const b of this.bodies) if (b.pid === entry.pid) return;

  _collideKin() {

  /* ================= claw state machine ================= */
  _setState(s) { this.state = s; this.stateT = 0; Bus.emit('claw:state', { state: s }); }

    if (!Game.player || Game.player.coins < cost) return { ok: false, cost, err: 'Not enough coins' };
    return { ok: true, cost, err: null };
  }
  startPlay() {
    if (this.state !== 'idle') return { ok: false, err: 'Busy' };
    let res;
    try { res = Remote.invoke('claw:start', {}); } catch (e) { res = { ok: false, err: 'Error' }; console.error(e); }
    if (res && res.ok) {
      this.playId = res.playId; this.timeLeft = (typeof ECONOMY !== 'undefined' && ECONOMY.playTime) || 20;

  }

    const T = _cmTmp();
    T.plane.constant = -(MACHINE_DIMS.baseHeight + 0.35);
    this._raycaster.setFromCamera(T.v2.set(nx, ny), Scene3D.camera);
    if (!this._raycaster.ray.intersectPlane(T.plane, T.hit)) return;
    toLocalMachine(T.hit, T.hit);

    this.aim.x = clamp(T.hit.x, P.minX + 0.15, P.maxX - 0.15); this.aim.z = clamp(T.hit.z, P.minZ + 0.15, P.maxZ - 0.15); this.aim.on = true;
  }
  drop() {
    if (this.state !== 'aim') return false;
    this.aim.on = false; this.inX = 0; this.inY = 0;
    _cmSfx('drop');
    this.openTarget = 1; this.openSpeed = 4; this._dropV = 0;
    this._setState('drop');
    return true;
  }

  _statsNow() { this.stats = _cmStatsOf(); return this.stats; }

  _moveMotor(on) { if (on !== this.motorOn) { this.motorOn = on; try { if (typeof Sfx !== 'undefined' && Sfx.motor) Sfx.motor(on); } catch (e) { /* ignore */ } } }

  _dropLimit() {

  _pickCandidate() {

    }

  }

  _doGrip() {

    let res = null;

  _glideTo(tx, tz, speed, dt) {

    this.openTarget = 0.5;

  }

  _updateKin(dt) {

  /* ================= per frame ================= */
  update(dt) {

    for (let i = 0; i < n; i++) {

      this._updateClaw(h);
      this._physics(h);
      this._postPhysics(h);
    }
    this._updateVisuals(dt);
  }

  _postPhysics(dt) {

    }, { passive: false });
  },
